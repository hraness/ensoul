name: Build or stage npm package

on:
  workflow_dispatch:
    inputs:
      publish_to_npm:
        description: Submit the verified artifact to npm staging
        required: true
        default: false
        type: boolean
      resolved_stage_version:
        description: Exact cleared stage-intent version that releases the retained history lock
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: npm-stage
  cancel-in-progress: false

jobs:
  verify:
    name: Verify exact package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      artifact_name: ${{ steps.pack.outputs.artifact_name }}
      package_version: ${{ steps.identity.outputs.version }}
      source_sha: ${{ steps.identity.outputs.source_sha }}
      tarball_name: ${{ steps.pack.outputs.tarball_name }}
      tarball_sha256: ${{ steps.pack.outputs.tarball_sha256 }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: Pin npm
        run: npm install --global npm@11.19.0 --ignore-scripts --registry=https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - name: Verify unpublished package identity
        id: identity
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]]; then
            echo "::error::npm staging must run from $DEFAULT_BRANCH"
            exit 1
          fi
          git fetch --no-tags origin "refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"
          source_sha="$(git rev-parse "origin/$DEFAULT_BRANCH")"
          if [[ "$GITHUB_SHA" != "$source_sha" || "$(git rev-parse HEAD)" != "$source_sha" ]]; then
            echo "::error::npm staging must run from current $DEFAULT_BRANCH head"
            exit 1
          fi
          package_name="$(bun -e 'console.log((await Bun.file("./package.json").json()).name)')"
          package_version="$(bun -e 'console.log((await Bun.file("./package.json").json()).version)')"
          if [[ "$package_name" != "@hraness/ensoul" ]]; then
            echo "::error::Unexpected package name $package_name"
            exit 1
          fi
          if [[ ! "$package_version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Package version is not stable semantic version"
            exit 1
          fi
          if git rev-parse --verify --quiet "refs/tags/v$package_version" >/dev/null; then
            echo "::error::Create v$package_version only after npm publication is verified"
            exit 1
          fi
          npm view "$package_name" name --json --registry=https://registry.npmjs.org >/dev/null
          version_error="$RUNNER_TEMP/npm-version-error.txt"
          if npm view "$package_name@$package_version" version --json \
            --registry=https://registry.npmjs.org >/dev/null 2>"$version_error"; then
            echo "::error::$package_name@$package_version is already public"
            exit 1
          fi
          if ! grep -q 'E404' "$version_error"; then
            cat "$version_error"
            echo "::error::Could not prove that $package_name@$package_version is unpublished"
            exit 1
          fi
          latest_version_json="$(npm view "$package_name" dist-tags.latest \
            --json --registry=https://registry.npmjs.org)"
          LATEST_VERSION_JSON="$latest_version_json" NEW_VERSION="$package_version" node <<'NODE'
          const stable = /^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/u;
          const parse = (value, label) => {
            const match = stable.exec(value);
            if (!match || match.slice(1).some(part => !Number.isSafeInteger(Number(part)))) {
              throw new Error(`${label} is not a supported stable semantic version`);
            }
            return match.slice(1).map(Number);
          };
          const latest = JSON.parse(process.env.LATEST_VERSION_JSON ?? "null");
          if (typeof latest !== "string") throw new Error("npm latest is not a version string");
          const currentParts = parse(latest, "npm latest");
          const candidateParts = parse(process.env.NEW_VERSION ?? "", "Candidate version");
          const comparison = candidateParts.findIndex((value, index) => value !== currentParts[index]);
          if (comparison < 0 || candidateParts[comparison] < currentParts[comparison]) {
            throw new Error(`Candidate ${process.env.NEW_VERSION} must be newer than npm latest ${latest}`);
          }
          NODE
          printf 'source_sha=%s\nversion=%s\n' "$source_sha" "$package_version" >> "$GITHUB_OUTPUT"
      - run: bun run typecheck
      - run: bun run test
      - run: bun run check:runtime-policy
      - run: bun run check:schema
      - name: Pack and smoke exact artifact
        id: pack
        run: |
          set -euo pipefail
          artifact_directory="$RUNNER_TEMP/ensoul-npm-package"
          pack_json="$artifact_directory/npm-pack.json"
          sha256_file="$artifact_directory/npm-package.sha256"
          mkdir -p "$artifact_directory"
          npm pack \
            --ignore-scripts \
            --json \
            --pack-destination "$artifact_directory" \
            --registry=https://registry.npmjs.org > "$pack_json"
          tarball_name="$(bun -e 'console.log((await Bun.file(process.argv.at(-1)).json())[0].filename)' "$pack_json")"
          tarball="$artifact_directory/$tarball_name"
          bun scripts/package-smoke.ts --archive "$tarball" --pack-json "$pack_json"
          tarball_sha256="$(sha256sum "$tarball" | awk '{ print $1 }')"
          metadata_sha256="$(sha256sum "$pack_json" | awk '{ print $1 }')"
          printf '%s  %s\n%s  npm-pack.json\n' \
            "$tarball_sha256" "$tarball_name" "$metadata_sha256" > "$sha256_file"
          artifact_name="npm-package-${{ steps.identity.outputs.version }}-$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          printf 'artifact_name=%s\ntarball_name=%s\ntarball_sha256=%s\n' \
            "$artifact_name" "$tarball_name" "$tarball_sha256" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.pack.outputs.artifact_name }}
          path: ${{ runner.temp }}/ensoul-npm-package
          if-no-files-found: error
          retention-days: 30

  stage:
    name: Stage exact package v${{ needs.verify.outputs.package_version }}
    if: inputs.publish_to_npm == true
    needs: verify
    environment:
      name: npm-stage
    permissions:
      actions: read
      id-token: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Reauthorize current npm stage attempt
        env:
          EXPECTED_ACTOR_ID: "894119"
          EXPECTED_REPOSITORY: "hraness/ensoul"
          EXPECTED_REPOSITORY_ID: "1350294135"
          EXPECTED_WORKFLOW_ID: "345387949"
          EXPECTED_WORKFLOW_NAME: "Build or stage npm package"
          EXPECTED_WORKFLOW_PATH: ".github/workflows/npm-stage.yml"
          GH_TOKEN: ${{ github.token }}
          INPUT_PUBLISH_TO_NPM: ${{ inputs.publish_to_npm }}
          REF_PROTECTED: ${{ github.ref_protected }}
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_RUN_ID" =~ ^[1-9][0-9]*$ || \
                ! "$GITHUB_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ || \
                ! "$GITHUB_SHA" =~ ^[a-f0-9]{40}$ || \
                "$GITHUB_EVENT_NAME" != workflow_dispatch || \
                "$GITHUB_REF" != refs/heads/main || \
                "$GITHUB_REPOSITORY" != "$EXPECTED_REPOSITORY" || \
                "$GITHUB_REPOSITORY_ID" != "$EXPECTED_REPOSITORY_ID" || \
                "$INPUT_PUBLISH_TO_NPM" != true || \
                "$REF_PROTECTED" != true ]]; then
            echo "::error::npm staging requires an intentional owner dispatch from protected main"
            exit 1
          fi
          attempt_json="$(mktemp "$RUNNER_TEMP/ensoul-stage-attempt.XXXXXX")"
          workflow_json="$(mktemp "$RUNNER_TEMP/ensoul-stage-workflow.XXXXXX")"
          repository_json="$(mktemp "$RUNNER_TEMP/ensoul-stage-repository.XXXXXX")"
          trap 'rm -f "$attempt_json" "$workflow_json" "$repository_json"' EXIT
          gh api --method GET \
            "/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT" \
            > "$attempt_json"
          gh api --method GET \
            "/repos/$GITHUB_REPOSITORY/actions/workflows/$EXPECTED_WORKFLOW_ID" \
            > "$workflow_json"
          gh api --method GET "/repos/$GITHUB_REPOSITORY" > "$repository_json"
          ATTEMPT_JSON="$attempt_json" \
            WORKFLOW_JSON="$workflow_json" \
            REPOSITORY_JSON="$repository_json" \
            EXPECTED_ACTOR_ID="$EXPECTED_ACTOR_ID" \
            EXPECTED_REPOSITORY="$EXPECTED_REPOSITORY" \
            EXPECTED_REPOSITORY_ID="$EXPECTED_REPOSITORY_ID" \
            EXPECTED_RUN_ID="$GITHUB_RUN_ID" \
            EXPECTED_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
            EXPECTED_SHA="$GITHUB_SHA" \
            EXPECTED_WORKFLOW_ID="$EXPECTED_WORKFLOW_ID" \
            EXPECTED_WORKFLOW_NAME="$EXPECTED_WORKFLOW_NAME" \
            EXPECTED_WORKFLOW_PATH="$EXPECTED_WORKFLOW_PATH" node <<'NODE'
          const { readFileSync } = require("node:fs");
          const positiveInteger = (name) => {
            const value = process.env[name] ?? "";
            if (!/^[1-9][0-9]*$/u.test(value)) throw new Error(`Invalid ${name}`);
            const number = Number(value);
            if (!Number.isSafeInteger(number)) throw new Error(`Unsafe ${name}`);
            return number;
          };
          const attempt = JSON.parse(readFileSync(process.env.ATTEMPT_JSON, "utf8"));
          const workflow = JSON.parse(readFileSync(process.env.WORKFLOW_JSON, "utf8"));
          const repository = JSON.parse(readFileSync(process.env.REPOSITORY_JSON, "utf8"));
          const actorId = positiveInteger("EXPECTED_ACTOR_ID");
          const repositoryId = positiveInteger("EXPECTED_REPOSITORY_ID");
          const runId = positiveInteger("EXPECTED_RUN_ID");
          const runAttempt = positiveInteger("EXPECTED_RUN_ATTEMPT");
          const workflowId = positiveInteger("EXPECTED_WORKFLOW_ID");
          if (
            attempt.id !== runId
            || attempt.run_attempt !== runAttempt
            || attempt.workflow_id !== workflowId
            || attempt.name !== process.env.EXPECTED_WORKFLOW_NAME
            || attempt.path !== process.env.EXPECTED_WORKFLOW_PATH
            || attempt.event !== "workflow_dispatch"
            || attempt.head_branch !== "main"
            || attempt.head_sha !== process.env.EXPECTED_SHA
            || attempt.status !== "in_progress"
            || attempt.conclusion !== null
            || attempt.actor?.id !== actorId
            || attempt.actor?.type !== "User"
            || attempt.triggering_actor?.id !== actorId
            || attempt.triggering_actor?.type !== "User"
            || attempt.repository?.id !== repositoryId
            || attempt.repository?.full_name !== process.env.EXPECTED_REPOSITORY
            || attempt.repository?.private !== false
            || workflow.id !== workflowId
            || workflow.name !== process.env.EXPECTED_WORKFLOW_NAME
            || workflow.path !== process.env.EXPECTED_WORKFLOW_PATH
            || workflow.state !== "active"
            || repository.id !== repositoryId
            || repository.full_name !== process.env.EXPECTED_REPOSITORY
            || repository.visibility !== "public"
            || repository.private !== false
            || repository.default_branch !== "main"
          ) throw new Error("Current npm stage attempt is not owner-authorized for this exact public workflow");
          NODE
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: Pin npm
        run: npm install --global npm@11.19.0 --ignore-scripts --registry=https://registry.npmjs.org
      - name: Reject unresolved stable-stage intent
        env:
          EXPECTED_VERSION: ${{ needs.verify.outputs.package_version }}
          EXPECTED_WORKFLOW_ID: "345387949"
          GH_TOKEN: ${{ github.token }}
          RESOLVED_STAGE_VERSION: ${{ inputs.resolved_stage_version }}
        run: |
          set -euo pipefail
          history_npm_directory="$(mktemp -d "$RUNNER_TEMP/ensoul-stage-history-npm.XXXXXX")"
          history_user_config="$(mktemp "$RUNNER_TEMP/ensoul-stage-history-user.XXXXXX")"
          history_global_config="$(mktemp "$RUNNER_TEMP/ensoul-stage-history-global.XXXXXX")"
          chmod 700 "$history_npm_directory"
          chmod 600 "$history_user_config" "$history_global_config"
          cd "$history_npm_directory"
          HISTORY_USER_CONFIG="$history_user_config" \
            HISTORY_GLOBAL_CONFIG="$history_global_config" node <<'NODE'
          const { spawnSync } = require("node:child_process");
          const expectedName = "@hraness/ensoul";
          const expectedVersion = process.env.EXPECTED_VERSION ?? "";
          const workflowId = process.env.EXPECTED_WORKFLOW_ID ?? "";
          const repository = process.env.GITHUB_REPOSITORY ?? "";
          const currentRunId = process.env.GITHUB_RUN_ID ?? "";
          const resolvedStageVersion = process.env.RESOLVED_STAGE_VERSION ?? "";
          const userConfig = process.env.HISTORY_USER_CONFIG ?? "";
          const globalConfig = process.env.HISTORY_GLOBAL_CONFIG ?? "";
          // These are the only generic-name jobs that reached the old terminal
          // npm staging step. Preserve the failed write as an intent too: a
          // provider-side write may succeed even when its client reports failure.
          const legacyStageJobs = new Map([
            ["33262478732", Object.freeze({
              headSha: "e8308cb3f89fd38377d68196b1d75a64675d2c6b",
              jobConclusion: "failure",
              mutationConclusion: "failure",
              runAttempt: 1,
              version: "0.3.0",
            })],
            ["33263116309", Object.freeze({
              headSha: "e8308cb3f89fd38377d68196b1d75a64675d2c6b",
              jobConclusion: "success",
              mutationConclusion: "success",
              runAttempt: 1,
              version: "0.3.0",
            })],
            ["33558844386", Object.freeze({
              headSha: "46c8b14d03fecdfe8d75e5a61d5f7bfcc255e674",
              jobConclusion: "success",
              mutationConclusion: "success",
              runAttempt: 1,
              version: "0.3.1",
            })],
          ]);
          const maximum = BigInt(Number.MAX_SAFE_INTEGER);
          const versionPattern = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/u;
          const parseVersion = (value, label) => {
            const match = versionPattern.exec(value);
            if (match === null) throw new Error(`${label} is not a stable semantic version`);
            const parts = match.slice(1).map(BigInt);
            if (parts.some(part => part > maximum)) {
              throw new Error(`${label} exceeds Number.MAX_SAFE_INTEGER`);
            }
            return parts;
          };
          const compare = (left, right) => {
            for (let index = 0; index < 3; index += 1) {
              if (left[index] !== right[index]) return left[index] > right[index] ? 1 : -1;
            }
            return 0;
          };
          const execute = (command, args, label) => {
            const result = spawnSync(command, args, {
              encoding: "utf8",
              maxBuffer: 10 * 1024 * 1024,
            });
            if (result.status !== 0 || result.error) throw new Error(`Could not read ${label}`);
            return result.stdout;
          };
          const workflowNumber = Number(workflowId);
          const currentRunNumber = Number(currentRunId);
          if (
            !/^[1-9][0-9]*$/u.test(workflowId)
            || !/^[1-9][0-9]*$/u.test(currentRunId)
            || !Number.isSafeInteger(workflowNumber)
            || !Number.isSafeInteger(currentRunNumber)
            || repository !== "hraness/ensoul"
            || userConfig === ""
            || globalConfig === ""
          ) throw new Error("Stable-stage history identity is invalid");
          const current = parseVersion(expectedVersion, "Candidate version");
          const resolved = resolvedStageVersion === ""
            ? null
            : parseVersion(resolvedStageVersion, "Resolved prior stage version");
          const latestValue = JSON.parse(execute("npm", [
            "view",
            expectedName,
            "dist-tags.latest",
            "--json",
            `--globalconfig=${globalConfig}`,
            "--registry=https://registry.npmjs.org",
            `--userconfig=${userConfig}`,
          ], "npm latest"));
          if (typeof latestValue !== "string") throw new Error("npm latest is not a version string");
          const latest = parseVersion(latestValue, "npm latest");
          if (compare(current, latest) <= 0) {
            throw new Error(`Candidate ${expectedVersion} must be newer than npm latest ${latestValue}`);
          }
          const intentRuns = new Map();
          const resolutionCounts = new Map();
          const increment = (map, version) => map.set(version, (map.get(version) ?? 0) + 1);
          const recordIntent = (version, runId) => {
            parseVersion(version, `Staged version from run ${runId}`);
            const runs = intentRuns.get(version) ?? [];
            runs.push(runId);
            intentRuns.set(version, runs);
          };
          const inspectRunJobs = (runId) => {
            const jobsPayload = JSON.parse(execute("gh", [
              "api",
              "--method", "GET",
              `/repos/${repository}/actions/runs/${runId}/jobs?filter=all&per_page=100`,
            ], `jobs for npm-stage run ${runId}`));
            if (
              !jobsPayload
              || typeof jobsPayload !== "object"
              || !Number.isSafeInteger(jobsPayload.total_count)
              || jobsPayload.total_count < 0
              || jobsPayload.total_count > 100
              || !Array.isArray(jobsPayload.jobs)
              || jobsPayload.jobs.length !== jobsPayload.total_count
            ) throw new Error(`npm-stage run ${runId} exceeds the reviewed 100-job bound`);
            for (const job of jobsPayload.jobs) {
              if (
                !job
                || typeof job !== "object"
                || typeof job.name !== "string"
                || !Array.isArray(job.steps)
                || job.steps.length > 100
              ) throw new Error(`npm-stage run ${runId} contains an invalid job`);
              const intents = job.steps.filter(step => (
                step?.name === "Record exclusive stable-stage intent"
                && step?.conclusion === "success"
              ));
              const resolutions = job.steps.filter(step => (
                typeof step?.name === "string"
                && step.name.startsWith("Record cleared stable-stage intent")
                && step?.conclusion === "success"
              ));
              const terminalWrites = job.steps.filter(step => (
                (
                  step?.name === "Submit verified package to npm staging"
                  || step?.name === "Revalidate current main and submit exact package to npm staging"
                )
                && step?.conclusion !== null
                && step?.conclusion !== "skipped"
              ));

              // Preserve only the exact provider-owned generic jobs from before
              // durable version-bound intents existed. Every other recognized
              // terminal write is subject to the intent checks below, regardless
              // of its enclosing job's display name.
              if (job.name === "Stage exact package") {
                const legacy = legacyStageJobs.get(String(runId));
                const legacyMutations = job.steps.filter(step => (
                  step?.name === "Submit verified package to npm staging"
                ));
                if (
                  legacy === undefined
                  || job.head_sha !== legacy.headSha
                  || job.run_attempt !== legacy.runAttempt
                  || job.conclusion !== legacy.jobConclusion
                  || legacyMutations.length !== 1
                  || legacyMutations[0]?.conclusion !== legacy.mutationConclusion
                  || terminalWrites.length !== 1
                  || intents.length !== 0
                  || resolutions.length !== 0
                ) {
                  throw new Error(`npm-stage run ${runId} has an unsealed generic stage job`);
                }
                recordIntent(legacy.version, runId);
                continue;
              }

              if (intents.length > 1) {
                throw new Error(`npm-stage run ${runId} has ambiguous successful intent steps`);
              }
              if (resolutions.length > 1) {
                throw new Error(`npm-stage run ${runId} has ambiguous successful resolution steps`);
              }
              if (terminalWrites.length > 1 || (terminalWrites.length === 1 && intents.length !== 1)) {
                throw new Error(`npm-stage run ${runId} has a terminal write without one durable intent`);
              }
              if (terminalWrites.length === 1) {
                const intentNumber = intents[0].number;
                const terminalNumber = terminalWrites[0].number;
                if (
                  !Number.isSafeInteger(intentNumber)
                  || intentNumber < 1
                  || !Number.isSafeInteger(terminalNumber)
                  || terminalNumber < 1
                  || terminalNumber !== intentNumber + 1
                ) {
                  throw new Error(
                    `npm-stage run ${runId} terminal write is not immediately preceded by its durable intent`,
                  );
                }
              }

              if (
                !job.name.startsWith("Stage exact package")
                && intents.length === 0
                && resolutions.length === 0
                && terminalWrites.length === 0
              ) continue;

              const match = /^Stage exact package v((?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*))$/u.exec(job.name);
              if (match === null) {
                throw new Error(`npm-stage run ${runId} lacks a version-bound stage job`);
              }
              const stagedVersion = match[1];
              parseVersion(stagedVersion, `Staged version from run ${runId}`);
              if (intents.length === 1) recordIntent(stagedVersion, runId);
              if (resolutions.length === 1) {
                const resolutionMatch = /^Record cleared stable-stage intent v((?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*))$/u.exec(resolutions[0].name);
                if (resolutionMatch === null) {
                  throw new Error(`npm-stage run ${runId} has an invalid cleared-intent identity`);
                }
                parseVersion(resolutionMatch[1], `Cleared version from run ${runId}`);
                increment(resolutionCounts, resolutionMatch[1]);
              }
            }
          };

          // A rerun changes the current run back to in_progress, so it drops out
          // of the completed-runs query. Inspect every attempt of this run
          // explicitly before scanning earlier completed dispatches.
          inspectRunJobs(currentRunNumber);
          const runsPayload = JSON.parse(execute("gh", [
            "api",
            "--method", "GET",
            `/repos/${repository}/actions/workflows/${workflowId}/runs?event=workflow_dispatch&status=completed&branch=main&per_page=100`,
          ], "completed npm-stage workflow runs"));
          if (
            !runsPayload
            || typeof runsPayload !== "object"
            || !Number.isSafeInteger(runsPayload.total_count)
            || runsPayload.total_count < 0
            || runsPayload.total_count > 100
            || !Array.isArray(runsPayload.workflow_runs)
            || runsPayload.workflow_runs.length !== runsPayload.total_count
          ) throw new Error("Completed npm-stage history exceeds the reviewed 100-run bound");
          for (const run of runsPayload.workflow_runs) {
            if (
              !run
              || typeof run !== "object"
              || !Number.isSafeInteger(run.id)
              || run.id <= 0
              || String(run.id) === currentRunId
              || run.workflow_id !== workflowNumber
              || run.event !== "workflow_dispatch"
              || run.head_branch !== "main"
              || run.status !== "completed"
            ) throw new Error("Completed npm-stage history contains an invalid run");
            inspectRunJobs(run.id);
          }
          for (const [version, count] of resolutionCounts) {
            if (count > (intentRuns.get(version)?.length ?? 0)) {
              throw new Error(`Retained history has a cleared ${version} intent without its matching reservation`);
            }
          }
          if (resolved !== null) {
            const reservations = intentRuns.get(resolvedStageVersion)?.length ?? 0;
            const resolutions = resolutionCounts.get(resolvedStageVersion) ?? 0;
            if (
              reservations <= resolutions
              || compare(resolved, latest) <= 0
              || compare(resolved, current) > 0
            ) {
              throw new Error(`Resolved prior stage ${resolvedStageVersion} does not identify a blocking intent`);
            }
            increment(resolutionCounts, resolvedStageVersion);
          }
          for (const [version, runs] of intentRuns) {
            const outstanding = runs.length - (resolutionCounts.get(version) ?? 0);
            if (outstanding > 0 && compare(parseVersion(version, "Reserved stage"), latest) > 0) {
              throw new Error(
                `Refusing to stage ${expectedVersion}: run ${runs[runs.length - 1]} already reserved stable stage ${version}`,
              );
            }
          }
          NODE
      - name: Record cleared stable-stage intent v${{ inputs.resolved_stage_version }}
        if: inputs.resolved_stage_version != ''
        env:
          RESOLVED_STAGE_VERSION: ${{ inputs.resolved_stage_version }}
        run: |
          set -euo pipefail
          if [[ ! "$RESOLVED_STAGE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Cleared stable-stage intent identity is invalid"
            exit 1
          fi
          echo "Recorded the cleared retained-history intent for @hraness/ensoul@$RESOLVED_STAGE_VERSION"
      - name: Bind artifact reference
        env:
          ARTIFACT_NAME: ${{ needs.verify.outputs.artifact_name }}
          EXPECTED_SOURCE_SHA: ${{ needs.verify.outputs.source_sha }}
          EXPECTED_VERSION: ${{ needs.verify.outputs.package_version }}
        run: |
          set -euo pipefail
          if [[ ! "$EXPECTED_SOURCE_SHA" =~ ^[a-f0-9]{40}$ || \
                ! "$EXPECTED_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Verified package identity is invalid"
            exit 1
          fi
          expected_artifact_name="npm-package-$EXPECTED_VERSION-$EXPECTED_SOURCE_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          if [[ "$ARTIFACT_NAME" != "$expected_artifact_name" ]]; then
            echo "::error::Verified artifact name is not bound to this run and attempt"
            exit 1
          fi
      - name: Download reviewed package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.verify.outputs.artifact_name }}
          path: ${{ runner.temp }}/ensoul-npm-package
      - name: Rebind downloaded package without repository code
        id: artifact
        env:
          EXPECTED_SOURCE_SHA: ${{ needs.verify.outputs.source_sha }}
          EXPECTED_TARBALL_NAME: ${{ needs.verify.outputs.tarball_name }}
          EXPECTED_VERSION: ${{ needs.verify.outputs.package_version }}
        run: |
          set -euo pipefail
          artifact_directory="$RUNNER_TEMP/ensoul-npm-package"
          pack_json="$artifact_directory/npm-pack.json"
          sha256_file="$artifact_directory/npm-package.sha256"
          if [[ ! "$EXPECTED_SOURCE_SHA" =~ ^[a-f0-9]{40}$ || \
                ! "$EXPECTED_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Verified package identity is invalid"
            exit 1
          fi
          expected_tarball_name="hraness-ensoul-$EXPECTED_VERSION.tgz"
          if [[ "$EXPECTED_TARBALL_NAME" != "$expected_tarball_name" ]]; then
            echo "::error::Tarball name does not match the verified version"
            exit 1
          fi
          tarball="$artifact_directory/$expected_tarball_name"
          rebound_output="$(mktemp "$RUNNER_TEMP/ensoul-rebound-digests.XXXXXX")"
          ARTIFACT_DIRECTORY="$artifact_directory" \
            DIGEST="$sha256_file" \
            EXPECTED_FILENAME="$expected_tarball_name" \
            EXPECTED_VERSION="$EXPECTED_VERSION" \
            METADATA="$pack_json" \
            TARBALL="$tarball" node > "$rebound_output" <<'NODE'
          const { createHash } = require("node:crypto");
          const { lstatSync, readFileSync, readdirSync } = require("node:fs");
          const { gunzipSync } = require("node:zlib");

          const directory = process.env.ARTIFACT_DIRECTORY;
          const digest = process.env.DIGEST;
          const expectedFilename = process.env.EXPECTED_FILENAME;
          const expectedVersion = process.env.EXPECTED_VERSION;
          const metadata = process.env.METADATA;
          const tarball = process.env.TARBALL;
          if (!directory || !digest || !expectedFilename || !expectedVersion || !metadata || !tarball) {
            throw new Error("Downloaded artifact environment is incomplete");
          }
          const entries = readdirSync(directory).sort();
          if (entries.length !== 3 || entries.join("\n") !== [expectedFilename, "npm-pack.json", "npm-package.sha256"].sort().join("\n")) {
            throw new Error("Downloaded artifact must contain exactly the reviewed three files");
          }
          for (const path of [digest, metadata, tarball]) {
            const info = lstatSync(path);
            if (!info.isFile() || info.isSymbolicLink()) throw new Error("Downloaded artifact contains an unsafe entry");
          }
          const archiveBytes = readFileSync(tarball);
          const metadataBytes = readFileSync(metadata);
          const digestBytes = readFileSync(digest);
          if (archiveBytes.length === 0 || archiveBytes.length > 512 * 1024) throw new Error("Tarball exceeds the reviewed size bound");
          if (metadataBytes.length === 0 || metadataBytes.length > 1024 * 1024) throw new Error("npm-pack.json exceeds the reviewed size bound");
          if (digestBytes.length === 0 || digestBytes.length > 1024) throw new Error("SHA-256 manifest exceeds the reviewed size bound");
          const archiveSha256 = createHash("sha256").update(archiveBytes).digest("hex");
          const metadataSha256 = createHash("sha256").update(metadataBytes).digest("hex");
          const digestText = new TextDecoder("utf-8", { fatal: true }).decode(digestBytes);
          const lines = digestText.split("\n");
          if (lines.length !== 3 || lines[2] !== "") throw new Error("SHA-256 manifest must have exactly two records");
          const expectedRecords = new Map([[expectedFilename, archiveSha256], ["npm-pack.json", metadataSha256]]);
          const actualRecords = new Map();
          for (const line of lines.slice(0, 2)) {
            const match = /^([a-f0-9]{64})  ([A-Za-z0-9._-]+)$/u.exec(line);
            if (!match || actualRecords.has(match[2])) throw new Error("SHA-256 manifest contains an invalid record");
            actualRecords.set(match[2], match[1]);
          }
          if (actualRecords.size !== 2 || [...expectedRecords].some(([name, value]) => actualRecords.get(name) !== value)) {
            throw new Error("Downloaded files differ from the independent SHA-256 manifest");
          }
          const input = JSON.parse(new TextDecoder("utf-8", { fatal: true }).decode(metadataBytes));
          if (!Array.isArray(input) || input.length !== 1) throw new Error("npm-pack.json must contain one package");
          const record = input[0];
          const expectedName = "@hraness/ensoul";
          if (!record || record.name !== expectedName || record.id !== `${expectedName}@${expectedVersion}` || record.version !== expectedVersion || record.filename !== expectedFilename) {
            throw new Error("npm-pack.json has the wrong package identity");
          }
          if (!Number.isSafeInteger(record.size) || record.size !== archiveBytes.length || record.size > 512 * 1024) {
            throw new Error("npm-pack.json has an invalid packed size");
          }
          if (!Number.isSafeInteger(record.entryCount) || record.entryCount < 1 || record.entryCount > 256 || !Array.isArray(record.files) || record.files.length !== record.entryCount) {
            throw new Error("npm-pack.json has an invalid file inventory");
          }
          if (!Number.isSafeInteger(record.unpackedSize) || record.unpackedSize < 1 || record.unpackedSize > 2 * 1024 * 1024) {
            throw new Error("npm-pack.json has an invalid unpacked size");
          }
          if (record.integrity !== `sha512-${createHash("sha512").update(archiveBytes).digest("base64")}` || record.shasum !== createHash("sha1").update(archiveBytes).digest("hex")) {
            throw new Error("Tarball differs from npm-pack.json integrity metadata");
          }
          const tarBytes = gunzipSync(archiveBytes, {
            maxOutputLength: 2 * 1024 * 1024 + 512 * 272,
          });
          const tarText = (header, start, length) => {
            const field = header.subarray(start, start + length);
            const zero = field.indexOf(0);
            const selected = zero < 0 ? field : field.subarray(0, zero);
            if (selected.some(byte => byte > 0x7f)) throw new Error("Packed manifest tar header is not ASCII");
            return selected.toString("ascii");
          };
          const tarOctal = (header, start, length, label) => {
            const text = tarText(header, start, length).trim();
            if (!/^[0-7]+$/u.test(text)) throw new Error(`Packed manifest has an invalid ${label}`);
            const value = Number.parseInt(text, 8);
            if (!Number.isSafeInteger(value) || value < 0) throw new Error(`Packed manifest has an unsafe ${label}`);
            return value;
          };
          const ustarSignature = Buffer.from([0x75, 0x73, 0x74, 0x61, 0x72, 0x00, 0x30, 0x30]);
          let offset = 0;
          let zeroBlocks = 0;
          let entryCount = 0;
          let manifestBytes;
          while (offset < tarBytes.length) {
            if (tarBytes.length - offset < 512) throw new Error("Packed manifest tar header is truncated");
            const header = tarBytes.subarray(offset, offset + 512);
            offset += 512;
            if (header.every(byte => byte === 0)) {
              zeroBlocks += 1;
              if (zeroBlocks === 2) {
                if (tarBytes.subarray(offset).some(byte => byte !== 0)) throw new Error("Packed manifest tar has trailing data");
                break;
              }
              continue;
            }
            if (zeroBlocks !== 0) throw new Error("Packed manifest tar terminator is invalid");
            const expectedChecksum = tarOctal(header, 148, 8, "checksum");
            let checksum = 0;
            for (let index = 0; index < header.length; index += 1) {
              checksum += index >= 148 && index < 156 ? 0x20 : header[index];
            }
            if (checksum !== expectedChecksum || !header.subarray(257, 265).equals(ustarSignature)) {
              throw new Error("Packed manifest tar header is invalid");
            }
            const name = tarText(header, 0, 100);
            const prefix = tarText(header, 345, header[475] === 0 ? 130 : 155);
            const path = prefix === "" ? name : `${prefix}/${name}`;
            if (path.startsWith("/") || path.includes("\\") || path.split("/").some(part => part === "" || part === "." || part === "..")) {
              throw new Error("Packed manifest tar path is unsafe");
            }
            const size = tarOctal(header, 124, 12, "size");
            const type = header[156];
            if (type !== 0 && type !== 0x30 && type !== 0x35) throw new Error("Packed manifest tar contains a non-regular entry");
            if (type === 0x35 && size !== 0) throw new Error("Packed manifest tar directory has data");
            if (size > tarBytes.length - offset) throw new Error("Packed manifest tar entry is truncated");
            const padded = Math.ceil(size / 512) * 512;
            if (padded > tarBytes.length - offset || tarBytes.subarray(offset + size, offset + padded).some(byte => byte !== 0)) {
              throw new Error("Packed manifest tar padding is invalid");
            }
            if (path === "package/package.json") {
              if ((type !== 0 && type !== 0x30) || manifestBytes !== undefined || size < 1 || size > 64 * 1024) {
                throw new Error("Packed package.json is missing, duplicated, or unsafe");
              }
              manifestBytes = Buffer.from(tarBytes.subarray(offset, offset + size));
            }
            offset += padded;
            entryCount += 1;
            if (entryCount > 272) throw new Error("Packed manifest tar contains too many entries");
          }
          if (zeroBlocks !== 2 || manifestBytes === undefined) throw new Error("Packed package.json is missing");
          const manifest = JSON.parse(new TextDecoder("utf-8", { fatal: true }).decode(manifestBytes));
          const publishConfig = manifest?.publishConfig;
          if (
            manifest?.name !== expectedName
            || manifest?.version !== expectedVersion
            || manifest?.private !== false
            || manifest?.contentPolicy?.class !== "dual-use"
            || Object.hasOwn(manifest, "tag")
            || publishConfig === null
            || typeof publishConfig !== "object"
            || Array.isArray(publishConfig)
            || JSON.stringify(Object.keys(publishConfig).sort()) !== JSON.stringify(["access", "registry"])
            || publishConfig.access !== "public"
            || publishConfig.registry !== "https://registry.npmjs.org"
          ) throw new Error("Packed package.json can publish only this dual-use package to the canonical public registry");
          process.stdout.write(`${archiveSha256} ${metadataSha256}\n`);
          NODE
          read -r rebound_archive_sha256 rebound_metadata_sha256 < "$rebound_output"
          if [[ ! "$rebound_archive_sha256" =~ ^[a-f0-9]{64}$ || \
                ! "$rebound_metadata_sha256" =~ ^[a-f0-9]{64}$ ]]; then
            echo "::error::Could not preserve rebound package digests"
            exit 1
          fi
          printf 'archive_sha256=%s\nmetadata_sha256=%s\ntarball=%s\n' \
            "$rebound_archive_sha256" "$rebound_metadata_sha256" "$tarball" >> "$GITHUB_OUTPUT"
      - name: Record exclusive stable-stage intent
        env:
          EXPECTED_VERSION: ${{ needs.verify.outputs.package_version }}
        run: |
          set -euo pipefail
          if [[ ! "$EXPECTED_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ || \
                ! "$GITHUB_RUN_ID" =~ ^[1-9][0-9]*$ || \
                ! "$GITHUB_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Stable-stage intent identity is invalid"
            exit 1
          fi
          echo "Reserved the exclusive retained-history intent for @hraness/ensoul@$EXPECTED_VERSION"
      - name: Revalidate current main and submit exact package to npm staging
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EXPECTED_ARCHIVE_SHA256: ${{ steps.artifact.outputs.archive_sha256 }}
          EXPECTED_METADATA_SHA256: ${{ steps.artifact.outputs.metadata_sha256 }}
          EXPECTED_SOURCE_SHA: ${{ needs.verify.outputs.source_sha }}
          EXPECTED_VERSION: ${{ needs.verify.outputs.package_version }}
          TARBALL: ${{ steps.artifact.outputs.tarball }}
        run: |
          set -euo pipefail
          git check-ref-format "refs/heads/$DEFAULT_BRANCH"
          current_main="$RUNNER_TEMP/ensoul-current-main.git"
          git init --quiet --bare "$current_main"
          git --git-dir="$current_main" fetch --quiet --no-tags --depth=1 \
            "https://github.com/$GITHUB_REPOSITORY.git" \
            "refs/heads/$DEFAULT_BRANCH"
          current_default_sha="$(git --git-dir="$current_main" rev-parse FETCH_HEAD)"
          if [[ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" || \
                "$GITHUB_SHA" != "$EXPECTED_SOURCE_SHA" || \
                "$GITHUB_SHA" != "$current_default_sha" ]]; then
            echo "::error::Default branch advanced after verification; rerun this workflow"
            exit 1
          fi
          current_archive_sha256="$(sha256sum "$TARBALL" | awk '{ print $1 }')"
          current_metadata_sha256="$(sha256sum "${TARBALL%/*}/npm-pack.json" | awk '{ print $1 }')"
          if [[ "$current_archive_sha256" != "$EXPECTED_ARCHIVE_SHA256" || \
                "$current_metadata_sha256" != "$EXPECTED_METADATA_SHA256" ]]; then
            echo "::error::Downloaded package changed after current-main verification"
            exit 1
          fi
          tag_ref="refs/tags/v$EXPECTED_VERSION"
          set +e
          tag_lookup_output="$(git ls-remote --exit-code --refs \
            "https://github.com/$GITHUB_REPOSITORY.git" "$tag_ref")"
          tag_lookup_status=$?
          set -e
          if [[ $tag_lookup_status -eq 0 || -n "$tag_lookup_output" ]]; then
            echo "::error::Tag v$EXPECTED_VERSION exists; npm delivery must precede the Git tag"
            exit 1
          fi
          if [[ $tag_lookup_status -ne 2 ]]; then
            echo "::error::Could not prove that tag v$EXPECTED_VERSION is absent"
            exit 1
          fi
          npm_user_config="$RUNNER_TEMP/ensoul-empty-user.npmrc"
          npm_global_config="$RUNNER_TEMP/ensoul-empty-global.npmrc"
          : > "$npm_user_config"
          : > "$npm_global_config"
          chmod 600 "$npm_user_config" "$npm_global_config"
          unset NPM_CONFIG_TAG npm_config_tag
          configured_tag="$(NPM_CONFIG_USERCONFIG="$npm_user_config" \
            NPM_CONFIG_GLOBALCONFIG="$npm_global_config" npm config get tag)"
          if [[ "$configured_tag" != latest ]]; then
            echo "::error::Pinned npm's clean default dist-tag is $configured_tag, expected latest"
            exit 1
          fi
          latest_before_stage="$(NPM_CONFIG_USERCONFIG="$npm_user_config" \
            NPM_CONFIG_GLOBALCONFIG="$npm_global_config" npm view "@hraness/ensoul" dist-tags.latest \
            --json --registry=https://registry.npmjs.org)"
          LATEST_VERSION_JSON="$latest_before_stage" EXPECTED_VERSION="$EXPECTED_VERSION" node <<'NODE'
          const pattern = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/u;
          const maximum = BigInt(Number.MAX_SAFE_INTEGER);
          const parse = (value, label) => {
            const match = pattern.exec(value);
            if (match === null) throw new Error(`${label} is not a stable semantic version`);
            const parts = match.slice(1).map(BigInt);
            if (parts.some(part => part > maximum)) throw new Error(`${label} exceeds Number.MAX_SAFE_INTEGER`);
            return parts;
          };
          const latestValue = JSON.parse(process.env.LATEST_VERSION_JSON ?? "null");
          if (typeof latestValue !== "string") throw new Error("npm latest is not a version string");
          const latest = parse(latestValue, "npm latest");
          const expected = parse(process.env.EXPECTED_VERSION ?? "", "Candidate version");
          const comparison = expected.findIndex((part, index) => part !== latest[index]);
          if (comparison < 0 || expected[comparison] < latest[comparison]) {
            throw new Error(`Candidate ${process.env.EXPECTED_VERSION} must still be newer than npm latest ${latestValue}`);
          }
          NODE
          NPM_CONFIG_USERCONFIG="$npm_user_config" \
            NPM_CONFIG_GLOBALCONFIG="$npm_global_config" npm stage publish "$TARBALL" \
            --access public \
            --ignore-scripts \
            --provenance \
            --registry=https://registry.npmjs.org
