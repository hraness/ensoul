name: Build or stage npm package

on:
  workflow_dispatch:
    inputs:
      publish_to_npm:
        description: Submit the verified artifact to npm staging
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: npm-stage
  cancel-in-progress: false

jobs:
  verify:
    name: Verify exact package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      artifact_name: ${{ steps.pack.outputs.artifact_name }}
      package_version: ${{ steps.identity.outputs.version }}
      source_sha: ${{ steps.identity.outputs.source_sha }}
      tarball_name: ${{ steps.pack.outputs.tarball_name }}
      tarball_sha256: ${{ steps.pack.outputs.tarball_sha256 }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: Pin npm
        run: npm install --global npm@11.19.0 --ignore-scripts --registry=https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - name: Verify unpublished package identity
        id: identity
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]]; then
            echo "::error::npm staging must run from $DEFAULT_BRANCH"
            exit 1
          fi
          git fetch --no-tags origin "refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"
          source_sha="$(git rev-parse "origin/$DEFAULT_BRANCH")"
          if [[ "$GITHUB_SHA" != "$source_sha" || "$(git rev-parse HEAD)" != "$source_sha" ]]; then
            echo "::error::npm staging must run from current $DEFAULT_BRANCH head"
            exit 1
          fi
          package_name="$(bun -e 'console.log((await Bun.file("./package.json").json()).name)')"
          package_version="$(bun -e 'console.log((await Bun.file("./package.json").json()).version)')"
          if [[ "$package_name" != "@hraness/ensoul" ]]; then
            echo "::error::Unexpected package name $package_name"
            exit 1
          fi
          if [[ ! "$package_version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Package version is not stable semantic version"
            exit 1
          fi
          if git rev-parse --verify --quiet "refs/tags/v$package_version" >/dev/null; then
            echo "::error::Create v$package_version only after npm publication is verified"
            exit 1
          fi
          npm view "$package_name" name --json --registry=https://registry.npmjs.org >/dev/null
          version_error="$RUNNER_TEMP/npm-version-error.txt"
          if npm view "$package_name@$package_version" version --json \
            --registry=https://registry.npmjs.org >/dev/null 2>"$version_error"; then
            echo "::error::$package_name@$package_version is already public"
            exit 1
          fi
          if ! grep -q 'E404' "$version_error"; then
            cat "$version_error"
            echo "::error::Could not prove that $package_name@$package_version is unpublished"
            exit 1
          fi
          printf 'source_sha=%s\nversion=%s\n' "$source_sha" "$package_version" >> "$GITHUB_OUTPUT"
      - run: bun run typecheck
      - run: bun run test
      - run: bun run check:runtime-policy
      - run: bun run check:schema
      - name: Pack and smoke exact artifact
        id: pack
        run: |
          set -euo pipefail
          artifact_directory="$RUNNER_TEMP/ensoul-npm-package"
          pack_json="$artifact_directory/npm-pack.json"
          sha256_file="$artifact_directory/npm-package.sha256"
          mkdir -p "$artifact_directory"
          npm pack \
            --ignore-scripts \
            --json \
            --pack-destination "$artifact_directory" \
            --registry=https://registry.npmjs.org > "$pack_json"
          tarball_name="$(bun -e 'console.log((await Bun.file(process.argv.at(-1)).json())[0].filename)' "$pack_json")"
          tarball="$artifact_directory/$tarball_name"
          bun scripts/package-smoke.ts --archive "$tarball" --pack-json "$pack_json"
          tarball_sha256="$(sha256sum "$tarball" | awk '{ print $1 }')"
          metadata_sha256="$(sha256sum "$pack_json" | awk '{ print $1 }')"
          printf '%s  %s\n%s  npm-pack.json\n' \
            "$tarball_sha256" "$tarball_name" "$metadata_sha256" > "$sha256_file"
          artifact_name="npm-package-${{ steps.identity.outputs.version }}-$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          printf 'artifact_name=%s\ntarball_name=%s\ntarball_sha256=%s\n' \
            "$artifact_name" "$tarball_name" "$tarball_sha256" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.pack.outputs.artifact_name }}
          path: ${{ runner.temp }}/ensoul-npm-package
          if-no-files-found: error
          retention-days: 30

  stage:
    name: Stage exact package
    if: inputs.publish_to_npm == true
    needs: verify
    environment:
      name: npm-stage
    permissions:
      id-token: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: Pin npm
        run: npm install --global npm@11.19.0 --ignore-scripts --registry=https://registry.npmjs.org
      - name: Bind artifact reference
        env:
          ARTIFACT_NAME: ${{ needs.verify.outputs.artifact_name }}
          EXPECTED_SOURCE_SHA: ${{ needs.verify.outputs.source_sha }}
          EXPECTED_VERSION: ${{ needs.verify.outputs.package_version }}
        run: |
          set -euo pipefail
          if [[ ! "$EXPECTED_SOURCE_SHA" =~ ^[a-f0-9]{40}$ || \
                ! "$EXPECTED_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Verified package identity is invalid"
            exit 1
          fi
          expected_artifact_name="npm-package-$EXPECTED_VERSION-$EXPECTED_SOURCE_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          if [[ "$ARTIFACT_NAME" != "$expected_artifact_name" ]]; then
            echo "::error::Verified artifact name is not bound to this run and attempt"
            exit 1
          fi
      - name: Download reviewed package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.verify.outputs.artifact_name }}
          path: ${{ runner.temp }}/ensoul-npm-package
      - name: Rebind downloaded package without repository code
        id: artifact
        env:
          EXPECTED_SOURCE_SHA: ${{ needs.verify.outputs.source_sha }}
          EXPECTED_TARBALL_NAME: ${{ needs.verify.outputs.tarball_name }}
          EXPECTED_VERSION: ${{ needs.verify.outputs.package_version }}
        run: |
          set -euo pipefail
          artifact_directory="$RUNNER_TEMP/ensoul-npm-package"
          pack_json="$artifact_directory/npm-pack.json"
          sha256_file="$artifact_directory/npm-package.sha256"
          if [[ ! "$EXPECTED_SOURCE_SHA" =~ ^[a-f0-9]{40}$ || \
                ! "$EXPECTED_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Verified package identity is invalid"
            exit 1
          fi
          expected_tarball_name="hraness-ensoul-$EXPECTED_VERSION.tgz"
          if [[ "$EXPECTED_TARBALL_NAME" != "$expected_tarball_name" ]]; then
            echo "::error::Tarball name does not match the verified version"
            exit 1
          fi
          tarball="$artifact_directory/$expected_tarball_name"
          rebound_output="$(mktemp "$RUNNER_TEMP/ensoul-rebound-digests.XXXXXX")"
          ARTIFACT_DIRECTORY="$artifact_directory" \
            DIGEST="$sha256_file" \
            EXPECTED_FILENAME="$expected_tarball_name" \
            EXPECTED_VERSION="$EXPECTED_VERSION" \
            METADATA="$pack_json" \
            TARBALL="$tarball" node > "$rebound_output" <<'NODE'
          const { createHash } = require("node:crypto");
          const { lstatSync, readFileSync, readdirSync } = require("node:fs");

          const directory = process.env.ARTIFACT_DIRECTORY;
          const digest = process.env.DIGEST;
          const expectedFilename = process.env.EXPECTED_FILENAME;
          const expectedVersion = process.env.EXPECTED_VERSION;
          const metadata = process.env.METADATA;
          const tarball = process.env.TARBALL;
          if (!directory || !digest || !expectedFilename || !expectedVersion || !metadata || !tarball) {
            throw new Error("Downloaded artifact environment is incomplete");
          }
          const entries = readdirSync(directory).sort();
          if (entries.length !== 3 || entries.join("\n") !== [expectedFilename, "npm-pack.json", "npm-package.sha256"].sort().join("\n")) {
            throw new Error("Downloaded artifact must contain exactly the reviewed three files");
          }
          for (const path of [digest, metadata, tarball]) {
            const info = lstatSync(path);
            if (!info.isFile() || info.isSymbolicLink()) throw new Error("Downloaded artifact contains an unsafe entry");
          }
          const archiveBytes = readFileSync(tarball);
          const metadataBytes = readFileSync(metadata);
          const digestBytes = readFileSync(digest);
          if (archiveBytes.length === 0 || archiveBytes.length > 512 * 1024) throw new Error("Tarball exceeds the reviewed size bound");
          if (metadataBytes.length === 0 || metadataBytes.length > 1024 * 1024) throw new Error("npm-pack.json exceeds the reviewed size bound");
          if (digestBytes.length === 0 || digestBytes.length > 1024) throw new Error("SHA-256 manifest exceeds the reviewed size bound");
          const archiveSha256 = createHash("sha256").update(archiveBytes).digest("hex");
          const metadataSha256 = createHash("sha256").update(metadataBytes).digest("hex");
          const digestText = new TextDecoder("utf-8", { fatal: true }).decode(digestBytes);
          const lines = digestText.split("\n");
          if (lines.length !== 3 || lines[2] !== "") throw new Error("SHA-256 manifest must have exactly two records");
          const expectedRecords = new Map([[expectedFilename, archiveSha256], ["npm-pack.json", metadataSha256]]);
          const actualRecords = new Map();
          for (const line of lines.slice(0, 2)) {
            const match = /^([a-f0-9]{64})  ([A-Za-z0-9._-]+)$/u.exec(line);
            if (!match || actualRecords.has(match[2])) throw new Error("SHA-256 manifest contains an invalid record");
            actualRecords.set(match[2], match[1]);
          }
          if (actualRecords.size !== 2 || [...expectedRecords].some(([name, value]) => actualRecords.get(name) !== value)) {
            throw new Error("Downloaded files differ from the independent SHA-256 manifest");
          }
          const input = JSON.parse(new TextDecoder("utf-8", { fatal: true }).decode(metadataBytes));
          if (!Array.isArray(input) || input.length !== 1) throw new Error("npm-pack.json must contain one package");
          const record = input[0];
          const expectedName = "@hraness/ensoul";
          if (!record || record.name !== expectedName || record.id !== `${expectedName}@${expectedVersion}` || record.version !== expectedVersion || record.filename !== expectedFilename) {
            throw new Error("npm-pack.json has the wrong package identity");
          }
          if (!Number.isSafeInteger(record.size) || record.size !== archiveBytes.length || record.size > 512 * 1024) {
            throw new Error("npm-pack.json has an invalid packed size");
          }
          if (!Number.isSafeInteger(record.entryCount) || record.entryCount < 1 || record.entryCount > 256 || !Array.isArray(record.files) || record.files.length !== record.entryCount) {
            throw new Error("npm-pack.json has an invalid file inventory");
          }
          if (!Number.isSafeInteger(record.unpackedSize) || record.unpackedSize < 1 || record.unpackedSize > 2 * 1024 * 1024) {
            throw new Error("npm-pack.json has an invalid unpacked size");
          }
          if (record.integrity !== `sha512-${createHash("sha512").update(archiveBytes).digest("base64")}` || record.shasum !== createHash("sha1").update(archiveBytes).digest("hex")) {
            throw new Error("Tarball differs from npm-pack.json integrity metadata");
          }
          process.stdout.write(`${archiveSha256} ${metadataSha256}\n`);
          NODE
          read -r rebound_archive_sha256 rebound_metadata_sha256 < "$rebound_output"
          if [[ ! "$rebound_archive_sha256" =~ ^[a-f0-9]{64}$ || \
                ! "$rebound_metadata_sha256" =~ ^[a-f0-9]{64}$ ]]; then
            echo "::error::Could not preserve rebound package digests"
            exit 1
          fi
          printf 'archive_sha256=%s\nmetadata_sha256=%s\ntarball=%s\n' \
            "$rebound_archive_sha256" "$rebound_metadata_sha256" "$tarball" >> "$GITHUB_OUTPUT"
      - name: Revalidate current main and submit exact package to npm staging
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EXPECTED_ARCHIVE_SHA256: ${{ steps.artifact.outputs.archive_sha256 }}
          EXPECTED_METADATA_SHA256: ${{ steps.artifact.outputs.metadata_sha256 }}
          EXPECTED_SOURCE_SHA: ${{ needs.verify.outputs.source_sha }}
          EXPECTED_VERSION: ${{ needs.verify.outputs.package_version }}
          TARBALL: ${{ steps.artifact.outputs.tarball }}
        run: |
          set -euo pipefail
          git check-ref-format "refs/heads/$DEFAULT_BRANCH"
          current_main="$RUNNER_TEMP/ensoul-current-main.git"
          git init --quiet --bare "$current_main"
          git --git-dir="$current_main" fetch --quiet --no-tags --depth=1 \
            "https://github.com/$GITHUB_REPOSITORY.git" \
            "refs/heads/$DEFAULT_BRANCH"
          current_default_sha="$(git --git-dir="$current_main" rev-parse FETCH_HEAD)"
          if [[ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" || \
                "$GITHUB_SHA" != "$EXPECTED_SOURCE_SHA" || \
                "$GITHUB_SHA" != "$current_default_sha" ]]; then
            echo "::error::Default branch advanced after verification; rerun this workflow"
            exit 1
          fi
          current_archive_sha256="$(sha256sum "$TARBALL" | awk '{ print $1 }')"
          current_metadata_sha256="$(sha256sum "${TARBALL%/*}/npm-pack.json" | awk '{ print $1 }')"
          if [[ "$current_archive_sha256" != "$EXPECTED_ARCHIVE_SHA256" || \
                "$current_metadata_sha256" != "$EXPECTED_METADATA_SHA256" ]]; then
            echo "::error::Downloaded package changed after current-main verification"
            exit 1
          fi
          tag_ref="refs/tags/v$EXPECTED_VERSION"
          set +e
          tag_lookup_output="$(git ls-remote --exit-code --refs \
            "https://github.com/$GITHUB_REPOSITORY.git" "$tag_ref")"
          tag_lookup_status=$?
          set -e
          if [[ $tag_lookup_status -eq 0 || -n "$tag_lookup_output" ]]; then
            echo "::error::Tag v$EXPECTED_VERSION exists; npm delivery must precede the Git tag"
            exit 1
          fi
          if [[ $tag_lookup_status -ne 2 ]]; then
            echo "::error::Could not prove that tag v$EXPECTED_VERSION is absent"
            exit 1
          fi
          npm stage publish "$TARBALL" \
            --access public \
            --ignore-scripts \
            --provenance \
            --registry=https://registry.npmjs.org
