name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: stable-release
  cancel-in-progress: false

jobs:
  authorize:
    name: Authorize owner release tag
    permissions: {}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify immutable owner and public repository identity
        env:
          EXPECTED_ACTOR_ID: "894119"
          EXPECTED_REPOSITORY: "hraness/ensoul"
          EXPECTED_REPOSITORY_ID: "1350294135"
          REF_PROTECTED: ${{ github.ref_protected }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" != push || \
                "$GITHUB_ACTOR_ID" != "$EXPECTED_ACTOR_ID" || \
                "$GITHUB_REPOSITORY" != "$EXPECTED_REPOSITORY" || \
                "$GITHUB_REPOSITORY_ID" != "$EXPECTED_REPOSITORY_ID" || \
                "$REF_PROTECTED" != true ]]; then
            echo "::error::Release requires an owner-created protected tag in the exact public repository"
            exit 1
          fi
          EXPECTED_ACTOR_ID="$EXPECTED_ACTOR_ID" \
            EXPECTED_REPOSITORY="$EXPECTED_REPOSITORY" \
            EXPECTED_REPOSITORY_ID="$EXPECTED_REPOSITORY_ID" node <<'NODE'
          const { readFileSync } = require("node:fs");
          const event = JSON.parse(readFileSync(process.env.GITHUB_EVENT_PATH, "utf8"));
          if (
            event.sender?.id !== Number(process.env.EXPECTED_ACTOR_ID)
            || event.sender?.type !== "User"
            || event.repository?.id !== Number(process.env.EXPECTED_REPOSITORY_ID)
            || event.repository?.full_name !== process.env.EXPECTED_REPOSITORY
            || event.repository?.visibility !== "public"
            || event.repository?.private !== false
            || event.repository?.default_branch !== "main"
          ) throw new Error("Tag-push sender or public repository identity is not the immutable release authority");
          NODE

  verify:
    name: Verify
    needs: authorize
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      default_branch: ${{ steps.identity.outputs.default_branch }}
      source_sha: ${{ steps.identity.outputs.source_sha }}
      verified_tag: ${{ steps.identity.outputs.tag }}
      workflow_sha: ${{ steps.identity.outputs.workflow_sha }}
      archive_sha256: ${{ steps.pack.outputs.archive_sha256 }}
      pack_sha256: ${{ steps.pack.outputs.pack_sha256 }}
      manifest_sha256: ${{ steps.pack.outputs.manifest_sha256 }}
      sums_sha256: ${{ steps.pack.outputs.sums_sha256 }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Fetch governed main history
        run: git fetch --no-tags --unshallow origin refs/heads/main:refs/remotes/origin/main
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: Pin npm
        run: npm install --global npm@11.19.0 --ignore-scripts --registry=https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - name: Verify release identity
        id: identity
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REF_PROTECTED: ${{ github.ref_protected }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" != push || "$REF_PROTECTED" != true ]]; then
            echo "::error::Release requires a protected owner-created stable tag"
            exit 1
          fi
          git check-ref-format "refs/heads/$DEFAULT_BRANCH"
          git fetch --no-tags origin \
            "refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"
          default_head="$(git rev-parse "origin/$DEFAULT_BRANCH")"
          checked_out_head="$(git rev-parse HEAD)"
          package_version="$(bun -e 'console.log((await Bun.file("./package.json").json()).version)')"
          if [[ ! "$package_version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Package version $package_version is not stable semantic version"
            exit 1
          fi
          expected_tag="v$package_version"
          if [[ "$GITHUB_REF" != "refs/tags/$expected_tag" || \
                "$GITHUB_REF_NAME" != "$expected_tag" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package version $expected_tag"
            exit 1
          fi
          git check-ref-format "refs/tags/$expected_tag"
          release_ref="refs/ensoul-release-tags/$expected_tag"
          git fetch --no-tags origin "refs/tags/$expected_tag:$release_ref"
          if [[ "$(git cat-file -t "$release_ref")" != tag ]]; then
            echo "::error::Release tag must be annotated"
            exit 1
          fi
          tag_commit="$(git rev-parse "$release_ref^{commit}")"
          if [[ "$GITHUB_SHA" != "$tag_commit" || \
                "$checked_out_head" != "$tag_commit" ]]; then
            echo "::error::Tag does not match the checked release commit"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$tag_commit" "$default_head"; then
            echo "::error::Tag $GITHUB_REF_NAME is not reachable from $DEFAULT_BRANCH"
            exit 1
          fi
          if ! git diff --quiet --no-ext-diff --no-textconv \
            "$tag_commit" "$default_head" -- \
            .github/workflows/release.yml \
            .github/workflows/npm-stage.yml; then
            echo "::error::Tagged and current release workflow controls differ"
            exit 1
          fi
          newest_stable_tag="$(git ls-remote --tags --refs origin 'refs/tags/v*' | cut -f2 | sed 's#refs/tags/##' | grep -E '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' | LC_ALL=C sort -V | tail -n 1)"
          if [[ "$newest_stable_tag" != "$GITHUB_REF_NAME" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME is not the newest stable version"
            exit 1
          fi
          printf 'default_branch=%s\nsource_sha=%s\ntag=%s\nworkflow_sha=%s\n' \
            "$DEFAULT_BRANCH" "$tag_commit" "$GITHUB_REF_NAME" "$default_head" \
            >> "$GITHUB_OUTPUT"
      - run: bun run typecheck
      - run: bun run test
      - run: bun run check:runtime-policy
      - run: bun run check:schema
      - name: Pack and verify canonical release artifact
        id: pack
        env:
          WORKFLOW_SHA: ${{ steps.identity.outputs.workflow_sha }}
          VERIFIED_SOURCE_SHA: ${{ steps.identity.outputs.source_sha }}
          VERIFIED_TAG: ${{ steps.identity.outputs.tag }}
        run: |
          set -euo pipefail
          artifact_directory="$RUNNER_TEMP/ensoul-release"
          mkdir -p "$artifact_directory"
          npm pack --ignore-scripts --json --pack-destination "$artifact_directory" \
            --registry=https://registry.npmjs.org > "$artifact_directory/npm-pack.json"
          current_package_smoke="$GITHUB_WORKSPACE/scripts/.current-package-smoke.ts"
          current_release_tool="$RUNNER_TEMP/current-github-release.mts"
          git show "$WORKFLOW_SHA:scripts/package-smoke.ts" > "$current_package_smoke"
          git show "$WORKFLOW_SHA:scripts/github-release.ts" > "$current_release_tool"
          test "$(git hash-object "$current_package_smoke")" = "$(git rev-parse "$WORKFLOW_SHA:scripts/package-smoke.ts")"
          test "$(git hash-object "$current_release_tool")" = "$(git rev-parse "$WORKFLOW_SHA:scripts/github-release.ts")"
          bun --no-env-file --config=/dev/null run "$current_package_smoke" \
            --archive "$artifact_directory/hraness-ensoul-${VERIFIED_TAG#v}.tgz" \
            --pack-json "$artifact_directory/npm-pack.json"
          node "$current_release_tool" prepare "$artifact_directory"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: canonical-package-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ensoul-release
          if-no-files-found: error
          retention-days: 30

  attest:
    name: Attest verified package
    needs: verify
    outputs:
      provenance_sha256: ${{ steps.bundle.outputs.provenance_sha256 }}
    permissions:
      actions: read
      contents: read
      id-token: write
      attestations: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      DEFAULT_BRANCH: ${{ needs.verify.outputs.default_branch }}
      VERIFIED_SOURCE_SHA: ${{ needs.verify.outputs.source_sha }}
      VERIFIED_TAG: ${{ needs.verify.outputs.verified_tag }}
      WORKFLOW_SHA: ${{ needs.verify.outputs.workflow_sha }}
      EXPECTED_ARCHIVE_SHA256: ${{ needs.verify.outputs.archive_sha256 }}
      EXPECTED_PACK_SHA256: ${{ needs.verify.outputs.pack_sha256 }}
      EXPECTED_MANIFEST_SHA256: ${{ needs.verify.outputs.manifest_sha256 }}
      EXPECTED_SUMS_SHA256: ${{ needs.verify.outputs.sums_sha256 }}
    steps:
      - name: Reauthorize current release attempt
        env:
          EXPECTED_ACTOR_ID: "894119"
          EXPECTED_REPOSITORY: "hraness/ensoul"
          EXPECTED_REPOSITORY_ID: "1350294135"
          EXPECTED_WORKFLOW_ID: "345387950"
          EXPECTED_WORKFLOW_NAME: "release"
          EXPECTED_WORKFLOW_PATH: ".github/workflows/release.yml"
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_RUN_ID" =~ ^[1-9][0-9]*$ || \
                ! "$GITHUB_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ || \
                ! "$VERIFIED_SOURCE_SHA" =~ ^[a-f0-9]{40}$ || \
                ! "$WORKFLOW_SHA" =~ ^[a-f0-9]{40}$ || \
                ! "$VERIFIED_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ || \
                "$DEFAULT_BRANCH" != main || \
                "$GITHUB_EVENT_NAME" != push || \
                "$GITHUB_REPOSITORY" != "$EXPECTED_REPOSITORY" || \
                "$GITHUB_REPOSITORY_ID" != "$EXPECTED_REPOSITORY_ID" || \
                "$GITHUB_REF" != "refs/tags/$VERIFIED_TAG" || \
                "$GITHUB_SHA" != "$VERIFIED_SOURCE_SHA" ]]; then
            echo "::error::Current release attempt is not the exact protected tag run"
            exit 1
          fi
          attempt_json="$(mktemp "$RUNNER_TEMP/ensoul-release-attempt.XXXXXX")"
          workflow_json="$(mktemp "$RUNNER_TEMP/ensoul-release-workflow.XXXXXX")"
          repository_json="$(mktemp "$RUNNER_TEMP/ensoul-release-repository.XXXXXX")"
          gh api --method GET \
            "/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT" \
            > "$attempt_json"
          gh api --method GET \
            "/repos/$GITHUB_REPOSITORY/actions/workflows/$EXPECTED_WORKFLOW_ID" \
            > "$workflow_json"
          gh api --method GET "/repos/$GITHUB_REPOSITORY" > "$repository_json"
          ATTEMPT_JSON="$attempt_json" \
            WORKFLOW_JSON="$workflow_json" \
            REPOSITORY_JSON="$repository_json" \
            EXPECTED_ACTOR_ID="$EXPECTED_ACTOR_ID" \
            EXPECTED_REPOSITORY="$EXPECTED_REPOSITORY" \
            EXPECTED_REPOSITORY_ID="$EXPECTED_REPOSITORY_ID" \
            EXPECTED_RUN_ID="$GITHUB_RUN_ID" \
            EXPECTED_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
            EXPECTED_SHA="$VERIFIED_SOURCE_SHA" \
            EXPECTED_TAG="$VERIFIED_TAG" \
            EXPECTED_WORKFLOW_ID="$EXPECTED_WORKFLOW_ID" \
            EXPECTED_WORKFLOW_NAME="$EXPECTED_WORKFLOW_NAME" \
            EXPECTED_WORKFLOW_PATH="$EXPECTED_WORKFLOW_PATH" node <<'NODE'
          const { readFileSync } = require("node:fs");
          const positiveInteger = (name) => {
            const value = process.env[name] ?? "";
            if (!/^[1-9][0-9]*$/u.test(value)) throw new Error(`Invalid ${name}`);
            const number = Number(value);
            if (!Number.isSafeInteger(number)) throw new Error(`Unsafe ${name}`);
            return number;
          };
          const attempt = JSON.parse(readFileSync(process.env.ATTEMPT_JSON, "utf8"));
          const workflow = JSON.parse(readFileSync(process.env.WORKFLOW_JSON, "utf8"));
          const repository = JSON.parse(readFileSync(process.env.REPOSITORY_JSON, "utf8"));
          const actorId = positiveInteger("EXPECTED_ACTOR_ID");
          const repositoryId = positiveInteger("EXPECTED_REPOSITORY_ID");
          const runId = positiveInteger("EXPECTED_RUN_ID");
          const runAttempt = positiveInteger("EXPECTED_RUN_ATTEMPT");
          const workflowId = positiveInteger("EXPECTED_WORKFLOW_ID");
          if (
            attempt.id !== runId
            || attempt.run_attempt !== runAttempt
            || attempt.workflow_id !== workflowId
            || attempt.name !== process.env.EXPECTED_WORKFLOW_NAME
            || attempt.path !== process.env.EXPECTED_WORKFLOW_PATH
            || attempt.event !== "push"
            || attempt.head_branch !== process.env.EXPECTED_TAG
            || attempt.head_sha !== process.env.EXPECTED_SHA
            || attempt.status !== "in_progress"
            || attempt.conclusion !== null
            || attempt.actor?.id !== actorId
            || attempt.actor?.type !== "User"
            || attempt.triggering_actor?.id !== actorId
            || attempt.triggering_actor?.type !== "User"
            || attempt.repository?.id !== repositoryId
            || attempt.repository?.full_name !== process.env.EXPECTED_REPOSITORY
            || attempt.repository?.private !== false
            || workflow.id !== workflowId
            || workflow.name !== process.env.EXPECTED_WORKFLOW_NAME
            || workflow.path !== process.env.EXPECTED_WORKFLOW_PATH
            || workflow.state !== "active"
            || repository.id !== repositoryId
            || repository.full_name !== process.env.EXPECTED_REPOSITORY
            || repository.visibility !== "public"
            || repository.private !== false
            || repository.default_branch !== "main"
          ) throw new Error("Current release attempt is not owner-authorized for this exact public workflow");
          NODE
          tag_ref_json="$(mktemp "$RUNNER_TEMP/ensoul-release-tag-ref.XXXXXX")"
          tag_object_json="$(mktemp "$RUNNER_TEMP/ensoul-release-tag-object.XXXXXX")"
          gh api --method GET "/repos/$GITHUB_REPOSITORY/git/ref/tags/$VERIFIED_TAG" > "$tag_ref_json"
          tag_object_sha="$(TAG_REF_JSON="$tag_ref_json" node -e '
            const value = JSON.parse(require("node:fs").readFileSync(process.env.TAG_REF_JSON, "utf8"));
            if (value?.object?.type !== "tag" || !/^[a-f0-9]{40}$/u.test(value.object.sha ?? "")) process.exit(1);
            process.stdout.write(value.object.sha);
          ')"
          gh api --method GET "/repos/$GITHUB_REPOSITORY/git/tags/$tag_object_sha" > "$tag_object_json"
          TAG_OBJECT_JSON="$tag_object_json" EXPECTED_SHA="$VERIFIED_SOURCE_SHA" node -e '
            const value = JSON.parse(require("node:fs").readFileSync(process.env.TAG_OBJECT_JSON, "utf8"));
            if (value?.object?.type !== "commit" || value.object.sha !== process.env.EXPECTED_SHA) process.exit(1);
          '
          current_default_sha="$(gh api --method GET --jq '.sha' \
            "/repos/$GITHUB_REPOSITORY/commits/$DEFAULT_BRANCH")"
          comparison_status="$(gh api --method GET --jq '.status' \
            "/repos/$GITHUB_REPOSITORY/compare/$VERIFIED_SOURCE_SHA...$current_default_sha")"
          if [[ "$comparison_status" != ahead && "$comparison_status" != identical ]]; then
            echo "::error::Tag $VERIFIED_TAG is no longer reachable from $DEFAULT_BRANCH"
            exit 1
          fi
      - name: Close current release authority before attestation
        run: |
          set -euo pipefail
          current_main="$(gh api --method GET "/repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          [[ "$current_main" =~ ^[a-f0-9]{40}$ ]]
          for source in "$VERIFIED_SOURCE_SHA" "$WORKFLOW_SHA"; do
            status="$(gh api --method GET "/repos/$GITHUB_REPOSITORY/compare/$source...$current_main" --jq .status)"
            [[ "$status" == ahead || "$status" == identical ]]
          done
          for path in .github/workflows/release.yml .github/workflows/npm-stage.yml; do
            tagged="$(gh api --method GET "/repos/$GITHUB_REPOSITORY/contents/$path?ref=$VERIFIED_SOURCE_SHA" --jq .sha)"
            current="$(gh api --method GET "/repos/$GITHUB_REPOSITORY/contents/$path?ref=$current_main" --jq .sha)"
            [[ "$tagged" =~ ^[a-f0-9]{40}$ && "$tagged" == "$current" ]]
          done
          for path in scripts/package-smoke.ts scripts/github-release.ts; do
            verified="$(gh api --method GET "/repos/$GITHUB_REPOSITORY/contents/$path?ref=$WORKFLOW_SHA" --jq .sha)"
            current="$(gh api --method GET "/repos/$GITHUB_REPOSITORY/contents/$path?ref=$current_main" --jq .sha)"
            [[ "$verified" =~ ^[a-f0-9]{40}$ && "$verified" == "$current" ]]
          done
          test "$(gh api --method GET "/repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" = "$current_main"
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: canonical-package-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ensoul-release
      - name: Bind attestation subjects without repository code
        run: |
          set -euo pipefail
          node <<'NODE'
          const { readFileSync, readdirSync, lstatSync } = require('node:fs');
          const { createHash } = require('node:crypto');
          const dir = `${process.env.RUNNER_TEMP}/ensoul-release`;
          const names = [`hraness-ensoul-${process.env.VERIFIED_TAG.slice(1)}.tgz`, 'npm-pack.json', 'release-manifest.json', 'SHA256SUMS'];
          if (JSON.stringify(readdirSync(dir).sort()) !== JSON.stringify([...names].sort())) throw new Error('Unexpected attestation subjects');
          for (const name of names) {
            const stat = lstatSync(`${dir}/${name}`);
            if (!stat.isFile() || stat.isSymbolicLink() || stat.size < 1 || stat.size > 524288) throw new Error('Unsafe subject file');
          }
          for (const [index, variable] of ['EXPECTED_ARCHIVE_SHA256', 'EXPECTED_PACK_SHA256', 'EXPECTED_MANIFEST_SHA256', 'EXPECTED_SUMS_SHA256'].entries()) {
            const expected = process.env[variable];
            const actual = createHash('sha256').update(readFileSync(`${dir}/${names[index]}`)).digest('hex');
            if (!/^[a-f0-9]{64}$/.test(expected || '') || actual !== expected) throw new Error(`Handoff differs from trusted ${variable}`);
          }
          const manifest = JSON.parse(readFileSync(`${dir}/release-manifest.json`, 'utf8'));
          if (manifest.repository !== 'hraness/ensoul' || manifest.repositoryId !== 1350294135 || manifest.sourceSha !== process.env.VERIFIED_SOURCE_SHA || manifest.workflowSha !== process.env.WORKFLOW_SHA || manifest.tag !== process.env.VERIFIED_TAG || manifest.runId !== Number(process.env.GITHUB_RUN_ID) || manifest.runAttempt !== Number(process.env.GITHUB_RUN_ATTEMPT)) throw new Error('Manifest belongs to a different run');
          const sums = names.slice(0, 3).map(name => `${createHash('sha256').update(readFileSync(`${dir}/${name}`)).digest('hex')}  ${name}\n`).join('');
          if (readFileSync(`${dir}/SHA256SUMS`, 'utf8') !== sums) throw new Error('Attestation subject checksum mismatch');
          NODE
      - name: Attest four verified release files
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            ${{ runner.temp }}/ensoul-release/hraness-ensoul-*.tgz
            ${{ runner.temp }}/ensoul-release/npm-pack.json
            ${{ runner.temp }}/ensoul-release/release-manifest.json
            ${{ runner.temp }}/ensoul-release/SHA256SUMS
          push-to-registry: false
          create-storage-record: false
      - name: Preserve verified provenance bundle
        id: bundle
        env:
          BUNDLE_PATH: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          set -euo pipefail
          test -f "$BUNDLE_PATH" && test ! -L "$BUNDLE_PATH"
          cp "$BUNDLE_PATH" "$RUNNER_TEMP/ensoul-release/provenance.jsonl"
          provenance_sha256="$(sha256sum "$RUNNER_TEMP/ensoul-release/provenance.jsonl" | cut -d' ' -f1)"
          printf 'provenance_sha256=%s\n' "$provenance_sha256" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: attested-package-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ensoul-release
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish canonical GitHub release
    needs: [verify, attest]
    permissions:
      actions: read
      contents: write
      attestations: read
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DEFAULT_BRANCH: ${{ needs.verify.outputs.default_branch }}
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      IMMUTABLE_RELEASES_ENABLED: ${{ vars.IMMUTABLE_RELEASES_ENABLED }}
      VERIFIED_SOURCE_SHA: ${{ needs.verify.outputs.source_sha }}
      VERIFIED_TAG: ${{ needs.verify.outputs.verified_tag }}
      WORKFLOW_SHA: ${{ needs.verify.outputs.workflow_sha }}
      EXPECTED_ARCHIVE_SHA256: ${{ needs.verify.outputs.archive_sha256 }}
      EXPECTED_PACK_SHA256: ${{ needs.verify.outputs.pack_sha256 }}
      EXPECTED_MANIFEST_SHA256: ${{ needs.verify.outputs.manifest_sha256 }}
      EXPECTED_SUMS_SHA256: ${{ needs.verify.outputs.sums_sha256 }}
      EXPECTED_PROVENANCE_SHA256: ${{ needs.attest.outputs.provenance_sha256 }}
    steps:
      - name: Reauthorize current release attempt
        env:
          EXPECTED_ACTOR_ID: "894119"
          EXPECTED_REPOSITORY: "hraness/ensoul"
          EXPECTED_REPOSITORY_ID: "1350294135"
          EXPECTED_WORKFLOW_ID: "345387950"
          EXPECTED_WORKFLOW_NAME: "release"
          EXPECTED_WORKFLOW_PATH: ".github/workflows/release.yml"
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_RUN_ID" =~ ^[1-9][0-9]*$ || \
                ! "$GITHUB_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ || \
                ! "$VERIFIED_SOURCE_SHA" =~ ^[a-f0-9]{40}$ || \
                ! "$WORKFLOW_SHA" =~ ^[a-f0-9]{40}$ || \
                ! "$VERIFIED_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ || \
                "$DEFAULT_BRANCH" != main || \
                "$GITHUB_EVENT_NAME" != push || \
                "$GITHUB_REPOSITORY" != "$EXPECTED_REPOSITORY" || \
                "$GITHUB_REPOSITORY_ID" != "$EXPECTED_REPOSITORY_ID" || \
                "$GITHUB_REF" != "refs/tags/$VERIFIED_TAG" || \
                "$GITHUB_SHA" != "$VERIFIED_SOURCE_SHA" ]]; then
            echo "::error::Current release attempt is not the exact protected tag run"
            exit 1
          fi
          attempt_json="$(mktemp "$RUNNER_TEMP/ensoul-release-attempt.XXXXXX")"
          workflow_json="$(mktemp "$RUNNER_TEMP/ensoul-release-workflow.XXXXXX")"
          repository_json="$(mktemp "$RUNNER_TEMP/ensoul-release-repository.XXXXXX")"
          gh api --method GET \
            "/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT" \
            > "$attempt_json"
          gh api --method GET \
            "/repos/$GITHUB_REPOSITORY/actions/workflows/$EXPECTED_WORKFLOW_ID" \
            > "$workflow_json"
          gh api --method GET "/repos/$GITHUB_REPOSITORY" > "$repository_json"
          ATTEMPT_JSON="$attempt_json" \
            WORKFLOW_JSON="$workflow_json" \
            REPOSITORY_JSON="$repository_json" \
            EXPECTED_ACTOR_ID="$EXPECTED_ACTOR_ID" \
            EXPECTED_REPOSITORY="$EXPECTED_REPOSITORY" \
            EXPECTED_REPOSITORY_ID="$EXPECTED_REPOSITORY_ID" \
            EXPECTED_RUN_ID="$GITHUB_RUN_ID" \
            EXPECTED_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
            EXPECTED_SHA="$VERIFIED_SOURCE_SHA" \
            EXPECTED_TAG="$VERIFIED_TAG" \
            EXPECTED_WORKFLOW_ID="$EXPECTED_WORKFLOW_ID" \
            EXPECTED_WORKFLOW_NAME="$EXPECTED_WORKFLOW_NAME" \
            EXPECTED_WORKFLOW_PATH="$EXPECTED_WORKFLOW_PATH" node <<'NODE'
          const { readFileSync } = require("node:fs");
          const positiveInteger = (name) => {
            const value = process.env[name] ?? "";
            if (!/^[1-9][0-9]*$/u.test(value)) throw new Error(`Invalid ${name}`);
            const number = Number(value);
            if (!Number.isSafeInteger(number)) throw new Error(`Unsafe ${name}`);
            return number;
          };
          const attempt = JSON.parse(readFileSync(process.env.ATTEMPT_JSON, "utf8"));
          const workflow = JSON.parse(readFileSync(process.env.WORKFLOW_JSON, "utf8"));
          const repository = JSON.parse(readFileSync(process.env.REPOSITORY_JSON, "utf8"));
          const actorId = positiveInteger("EXPECTED_ACTOR_ID");
          const repositoryId = positiveInteger("EXPECTED_REPOSITORY_ID");
          const runId = positiveInteger("EXPECTED_RUN_ID");
          const runAttempt = positiveInteger("EXPECTED_RUN_ATTEMPT");
          const workflowId = positiveInteger("EXPECTED_WORKFLOW_ID");
          if (
            attempt.id !== runId
            || attempt.run_attempt !== runAttempt
            || attempt.workflow_id !== workflowId
            || attempt.name !== process.env.EXPECTED_WORKFLOW_NAME
            || attempt.path !== process.env.EXPECTED_WORKFLOW_PATH
            || attempt.event !== "push"
            || attempt.head_branch !== process.env.EXPECTED_TAG
            || attempt.head_sha !== process.env.EXPECTED_SHA
            || attempt.status !== "in_progress"
            || attempt.conclusion !== null
            || attempt.actor?.id !== actorId
            || attempt.actor?.type !== "User"
            || attempt.triggering_actor?.id !== actorId
            || attempt.triggering_actor?.type !== "User"
            || attempt.repository?.id !== repositoryId
            || attempt.repository?.full_name !== process.env.EXPECTED_REPOSITORY
            || attempt.repository?.private !== false
            || workflow.id !== workflowId
            || workflow.name !== process.env.EXPECTED_WORKFLOW_NAME
            || workflow.path !== process.env.EXPECTED_WORKFLOW_PATH
            || workflow.state !== "active"
            || repository.id !== repositoryId
            || repository.full_name !== process.env.EXPECTED_REPOSITORY
            || repository.visibility !== "public"
            || repository.private !== false
            || repository.default_branch !== "main"
          ) throw new Error("Current release attempt is not owner-authorized for this exact public workflow");
          NODE
          tag_ref_json="$(mktemp "$RUNNER_TEMP/ensoul-release-tag-ref.XXXXXX")"
          tag_object_json="$(mktemp "$RUNNER_TEMP/ensoul-release-tag-object.XXXXXX")"
          gh api --method GET "/repos/$GITHUB_REPOSITORY/git/ref/tags/$VERIFIED_TAG" > "$tag_ref_json"
          tag_object_sha="$(TAG_REF_JSON="$tag_ref_json" node -e '
            const value = JSON.parse(require("node:fs").readFileSync(process.env.TAG_REF_JSON, "utf8"));
            if (value?.object?.type !== "tag" || !/^[a-f0-9]{40}$/u.test(value.object.sha ?? "")) process.exit(1);
            process.stdout.write(value.object.sha);
          ')"
          gh api --method GET "/repos/$GITHUB_REPOSITORY/git/tags/$tag_object_sha" > "$tag_object_json"
          TAG_OBJECT_JSON="$tag_object_json" EXPECTED_SHA="$VERIFIED_SOURCE_SHA" node -e '
            const value = JSON.parse(require("node:fs").readFileSync(process.env.TAG_OBJECT_JSON, "utf8"));
            if (value?.object?.type !== "commit" || value.object.sha !== process.env.EXPECTED_SHA) process.exit(1);
          '
          current_default_sha="$(gh api --method GET --jq '.sha' \
            "/repos/$GITHUB_REPOSITORY/commits/$DEFAULT_BRANCH")"
          comparison_status="$(gh api --method GET --jq '.status' \
            "/repos/$GITHUB_REPOSITORY/compare/$VERIFIED_SOURCE_SHA...$current_default_sha")"
          if [[ "$comparison_status" != ahead && "$comparison_status" != identical ]]; then
            echo "::error::Tag $VERIFIED_TAG is no longer reachable from $DEFAULT_BRANCH"
            exit 1
          fi
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false
          ref: main
      - name: Fetch governed main history
        run: git fetch --no-tags --unshallow origin refs/heads/main:refs/remotes/origin/main
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: attested-package-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ensoul-release
      - name: Require immutable releases before publication
        run: |
          set -euo pipefail
          test "$IMMUTABLE_RELEASES_ENABLED" = true
      - name: Publish verified GitHub release
        run: |
          set -euo pipefail
          current_release_tool="$RUNNER_TEMP/current-github-release.mts"
          git show "$WORKFLOW_SHA:scripts/github-release.ts" > "$current_release_tool"
          test "$(git hash-object "$current_release_tool")" = "$(git rev-parse "$WORKFLOW_SHA:scripts/github-release.ts")"
          node "$current_release_tool" publish "$RUNNER_TEMP/ensoul-release"
