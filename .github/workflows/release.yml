          // archive dialect that could identify a different package.json.
          const tar = gunzipSync(archiveBytes, {
            maxOutputLength: maximumUnpackedBytes + maximumFiles * 1_024 + 1_024,
          });
          const tarText = (header, start, length, label) => {
            const field = header.subarray(start, start + length);
            const zero = field.indexOf(0);
            const selected = zero < 0 ? field : field.subarray(0, zero);
            if (zero >= 0 && field.subarray(zero).some(byte => byte !== 0)) {
              throw new Error(`Packed npm tar ${label} has data after its terminator`);
            }
            return new TextDecoder("utf-8", { fatal: true }).decode(selected);
          };
          const tarOctal = (header, start, length, label) => {
            const field = header.subarray(start, start + length);
            if (field.some(byte => byte > 0x7f)) {
              throw new Error(`Packed npm tar has a non-ASCII ${label}`);
            }
            const zero = field.indexOf(0);
            const selected = zero < 0 ? field : field.subarray(0, zero);
            if (
              zero >= 0
              && field.subarray(zero).some(byte => byte !== 0 && byte !== 0x20)
            ) {
              throw new Error(`Packed npm tar ${label} has invalid trailing data`);
            }
            const text = selected.toString("ascii").trim();
            if (!/^[0-7]+$/u.test(text)) {
              throw new Error(`Packed npm tar has an invalid ${label}`);
            }
            const value = Number.parseInt(text, 8);
            if (!Number.isSafeInteger(value) || value < 0) {
              throw new Error(`Packed npm tar has an unsafe ${label}`);
            }
            return value;
          };
          const ustarSignature = Buffer.from([
            0x75, 0x73, 0x74, 0x61, 0x72, 0x00, 0x30, 0x30,
          ]);
          const archiveFiles = new Map();
          let manifestBytes;
          let offset = 0;
          let zeroBlocks = 0;
          let entries = 0;
          while (offset < tar.length) {
            if (tar.length - offset < 512) {
              throw new Error("Packed manifest tar header is truncated");
            }
            const header = tar.subarray(offset, offset + 512);
            offset += 512;
            if (header.every(byte => byte === 0)) {
              zeroBlocks += 1;
              if (zeroBlocks === 2) {
                if (tar.subarray(offset).some(byte => byte !== 0)) {
                  throw new Error("Packed npm tar has trailing data");
                }
                break;
              }
              continue;
            }
            if (zeroBlocks !== 0) {
              throw new Error("Packed npm tar terminator is invalid");
            }
            const expectedChecksum = tarOctal(header, 148, 8, "checksum");
            let checksum = 0;
            for (let index = 0; index < header.length; index += 1) {
              checksum += index >= 148 && index < 156 ? 0x20 : header[index];
            }
            if (
              checksum !== expectedChecksum
              || !header.subarray(257, 265).equals(ustarSignature)
            ) {
              throw new Error("Packed manifest tar header is invalid");
            }
            const name = tarText(header, 0, 100, "name");
            const prefixLength = header[475] === 0 ? 130 : 155;
            const prefix = tarText(header, 345, prefixLength, "prefix");
            const rawPath = prefix === "" ? name : `${prefix}/${name}`;
            const normalizedPath = posix.normalize(rawPath);
            const pathParts = normalizedPath.split("/");
            if (
              rawPath !== normalizedPath
              || rawPath.startsWith("/")
              || rawPath.includes("\\")
              || rawPath.includes("\0")
              || pathParts[0] !== "package"
              || pathParts.length < 2
              || pathParts.some(part => part === "" || part === "." || part === "..")
            ) {
              throw new Error("Packed manifest tar path is unsafe or non-canonical");
            }
            const packagePath = pathParts.slice(1).join("/");
            const size = tarOctal(header, 124, 12, "size");
            const mode = tarOctal(header, 100, 8, "mode") & 0o777;
            const type = header[156];
            if (type !== 0 && type !== 0x30) {
              throw new Error("Packed npm tar contains a non-regular entry");
            }
            if (size > tar.length - offset) {
              throw new Error("Packed npm tar entry is truncated");
            }
            const padded = Math.ceil(size / 512) * 512;
            if (
              padded > tar.length - offset
              || tar.subarray(offset + size, offset + padded).some(byte => byte !== 0)
            ) {
              throw new Error("Packed npm tar padding is invalid");
            }
            if (archiveFiles.has(packagePath)) {
              throw new Error(`Packed npm tar duplicates normalized path ${packagePath}`);
            }
            archiveFiles.set(packagePath, { mode, size });
            if (packagePath === "package.json") {
              if (manifestBytes !== undefined || size < 1 || size > 64 * 1024) {
                throw new Error("Packed package.json is missing, duplicated, or unsafe");
              }
              manifestBytes = Buffer.from(tar.subarray(offset, offset + size));
            }
            offset += padded;
            entries += 1;
            if (entries > maximumFiles) {
              throw new Error("Packed npm tar contains too many entries");
            }
          }
          if (zeroBlocks !== 2 || manifestBytes === undefined) {
            throw new Error("Packed package.json is missing");
          }
          if (archiveFiles.size !== paths.size) {
            throw new Error("Packed npm tar inventory differs from npm-pack.json");
          }
          for (const file of record.files) {
            const archiveFile = archiveFiles.get(file.path);
            if (
              archiveFile === undefined
              || archiveFile.size !== file.size
              || archiveFile.mode !== file.mode
            ) {
              throw new Error(`Packed npm tar metadata differs at ${file.path}`);
            }
          }
          const manifest = JSON.parse(
            new TextDecoder("utf-8", { fatal: true }).decode(manifestBytes),
          );
          const publishConfig = manifest?.publishConfig;
          const publishKeys = publishConfig !== null
            && typeof publishConfig === "object"
            && !Array.isArray(publishConfig)
              ? Object.keys(publishConfig).sort()
              : [];
          if (
            manifest === null
            || typeof manifest !== "object"
            || Array.isArray(manifest)
            || manifest.name !== expectedName
            || manifest.version !== expectedVersion
            || manifest.private === true
            || Object.prototype.hasOwnProperty.call(manifest, "contentPolicy")
            || Object.prototype.hasOwnProperty.call(manifest, "tag")
            || JSON.stringify(publishKeys) !== JSON.stringify(["access", "registry"])
            || publishConfig.access !== "public"
            || publishConfig.registry !== "https://registry.npmjs.org"
          ) {
            throw new Error("Packed package manifest can override the canonical npm publication boundary");
          }
          process.stdout.write(`${archiveSha256} ${integrity}\n`);
          NODE
          read -r rebound_archive_sha256 rebound_archive_integrity < "$rebound_output"
          if [[ ! "$rebound_archive_sha256" =~ ^[a-f0-9]{64}$ || \
                ! "$rebound_archive_integrity" =~ ^sha512-[A-Za-z0-9+/]{86}==$ || \
                "$rebound_archive_sha256" != "$EXPECTED_ARCHIVE_SHA256" ]]; then
            echo "::error::Could not preserve rebound package digests"
            exit 1
          fi
          printf 'archive_sha256=%s\narchive_integrity=%s\ntarball=%s\n' \
            "$rebound_archive_sha256" "$rebound_archive_integrity" "$tarball" \
            >> "$GITHUB_OUTPUT"
      - name: Publish the exact canonical archive through npm trusted publishing
        id: npm
        env:
          EXPECTED_ARCHIVE_INTEGRITY: ${{ steps.artifact.outputs.archive_integrity }}
          EXPECTED_ARCHIVE_SHA256: ${{ steps.artifact.outputs.archive_sha256 }}
          EXPECTED_VERSION: ${{ steps.canonical.outputs.package_version }}
          TARBALL: ${{ steps.artifact.outputs.tarball }}
        run: |
          set -euo pipefail
          node -e '
            const conflicting = Object.keys(process.env)
              .filter(name => name.toLowerCase() === "npm_config_tag");
            if (conflicting.length !== 0) {
              throw new Error(`Ambient npm tag configuration is forbidden: ${conflicting.join(", ")}`);
            }
          '
          if [[ ! "$EXPECTED_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ || \
                ! "$EXPECTED_ARCHIVE_SHA256" =~ ^[a-f0-9]{64}$ || \
                ! "$EXPECTED_ARCHIVE_INTEGRITY" =~ ^sha512-[A-Za-z0-9+/]{86}==$ || \
                "$GITHUB_REF" != "refs/tags/v$EXPECTED_VERSION" ]]; then
            echo "::error::npm publication identity is invalid"
            exit 1
          fi
          clean_npm_directory="$(mktemp -d "$RUNNER_TEMP/soulscrape-npm-clean.XXXXXX")"
          clean_user_config="$(mktemp "$RUNNER_TEMP/soulscrape-npm-user.XXXXXX")"
          clean_global_config="$(mktemp "$RUNNER_TEMP/soulscrape-npm-global.XXXXXX")"
          chmod 700 "$clean_npm_directory"
          chmod 600 "$clean_user_config" "$clean_global_config"
          if [[ "$(cd "$clean_npm_directory" && npm config get tag \
                --userconfig="$clean_user_config" \
                --globalconfig="$clean_global_config")" != latest ]]; then
            echo "::error::Pinned npm's clean default publication tag is not latest"
            exit 1
          fi
          current_archive_sha256="$(sha256sum "$TARBALL" | cut -d ' ' -f 1)"
          if [[ "$current_archive_sha256" != "$EXPECTED_ARCHIVE_SHA256" ]]; then
            echo "::error::Admitted archive changed before npm publication"
            exit 1
          fi
          registry_state="$(EXPECTED_VERSION="$EXPECTED_VERSION" EXPECTED_ARCHIVE_INTEGRITY="$EXPECTED_ARCHIVE_INTEGRITY" node --input-type=module <<'NODE'
          const name = "@hraness/soulscrape";
          const version = process.env.EXPECTED_VERSION ?? "";
          const expectedIntegrity = process.env.EXPECTED_ARCHIVE_INTEGRITY ?? "";
          const response = await fetch(`https://registry.npmjs.org/${encodeURIComponent(name)}/${encodeURIComponent(version)}`, {
            cache: "no-store", redirect: "error", signal: AbortSignal.timeout(30_000),
            headers: { Accept: "application/json", "Cache-Control": "no-cache", "User-Agent": "soulscrape-release" },
          });
          const text = await response.text();
          if (text.length > 1_000_000) throw new Error("npm registry version response exceeds its bound");
          if (response.status === 404) { process.stdout.write("absent"); }
          else if (response.status === 200) {
            const payload = JSON.parse(text);
            if (payload?.name !== name || payload?.version !== version || typeof payload?.dist?.integrity !== "string") {
              throw new Error("npm registry returned an invalid published version");
            }
            if (payload.dist.integrity !== expectedIntegrity) {
              throw new Error(`npm already publishes ${name}@${version} with different bytes; never overwrite it`);
            }
            process.stdout.write("published");
          } else throw new Error(`npm registry returned HTTP ${response.status} for ${name}@${version}`);
          NODE
          )"
          if [[ "$registry_state" == published ]]; then
            echo "@hraness/soulscrape@$EXPECTED_VERSION already publishes the exact canonical bytes; nothing to publish"
            printf 'npm_state=published\npublished_identity=%s\n' "@hraness/soulscrape@$EXPECTED_VERSION $EXPECTED_ARCHIVE_INTEGRITY" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$registry_state" != absent ]]; then
            echo "::error::npm registry state is ambiguous"
            exit 1
          fi
          registry_json="$(mktemp "$RUNNER_TEMP/soulscrape-npm-metadata.XXXXXX")"
          node --input-type=module > "$registry_json" <<'NODE'
          const response = await fetch("https://registry.npmjs.org/%40hraness%2Fsoulscrape", {
            cache: "no-store", redirect: "error", signal: AbortSignal.timeout(30_000),
            headers: { Accept: "application/json", "Cache-Control": "no-cache", "User-Agent": "soulscrape-release" },
          });
          if (response.status !== 200) throw new Error(`npm package metadata returned HTTP ${response.status}`);
          const text = await response.text();
          if (text.length > 5_000_000) throw new Error("npm package metadata exceeds its bound");
          process.stdout.write(text);
          NODE
          REGISTRY_JSON="$registry_json" EXPECTED_VERSION="$EXPECTED_VERSION" node <<'NODE'
          const { readFileSync } = require("node:fs");
          const maximum = 9007199254740991n;
          const pattern = /^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/u;
          const parse = (value, label) => {
            const match = pattern.exec(value);
            if (match === null) throw new Error(`${label} is not stable SemVer`);
            const components = match.slice(1).map(BigInt);
            if (components.some(component => component > maximum)) {
              throw new Error(`${label} exceeds npm 11's safe SemVer component bound`);
            }
            return components;
          };
          const record = (value, label) => {
            if (value === null || typeof value !== "object" || Array.isArray(value)) throw new Error(`${label} is not an object`);
            return value;
          };
          const candidate = parse(process.env.EXPECTED_VERSION ?? "", "release candidate");
          const metadata = record(JSON.parse(readFileSync(process.env.REGISTRY_JSON, "utf8")), "npm package metadata");
          if (metadata.name !== "@hraness/soulscrape") throw new Error("npm package metadata names another package");
          const tags = record(metadata["dist-tags"], "npm dist-tags");
          const versions = record(metadata.versions, "npm versions");
          if (Object.hasOwn(versions, process.env.EXPECTED_VERSION)) throw new Error("npm candidate appeared after the exact-version check; reconcile before retrying");
          const bootstrapVersion = "0.4.0-bootstrap.1";
          if (!Object.hasOwn(tags, "latest") || tags.latest === bootstrapVersion) {
            // One reviewed first-publication state, including the observed latest alias.
            const tagKeys = Object.keys(tags).sort().join(",");
            if (process.env.EXPECTED_VERSION !== "0.4.0"
              || (tagKeys !== "bootstrap" && tagKeys !== "bootstrap,latest")
              || tags.bootstrap !== bootstrapVersion
              || (Object.hasOwn(tags, "latest") && tags.latest !== bootstrapVersion)
              || Object.keys(versions).length !== 1 || !Object.hasOwn(versions, bootstrapVersion)) {
              throw new Error("First publication requires only the exact reviewed bootstrap version and tags");
            }
            const bootstrap = record(versions[bootstrapVersion], "npm bootstrap version");
            if (bootstrap.name !== "@hraness/soulscrape" || bootstrap.version !== bootstrapVersion
              || bootstrap.dist?.integrity !== "sha512-mzPKNSBBJTlA7y5iEBcaA+Aw+V818UH49+jtQAygjGOPO60GfzF1daMHE8RYdW1+quyswli1H4fnPNmfA93tzw==") {
              throw new Error("npm bootstrap identity or archive differs from the reviewed artifact");
            }
            process.exit(0);
          }
          const latestValue = tags.latest;
          if (typeof latestValue !== "string") throw new Error("npm latest is not one exact version");
          const latest = parse(latestValue, "npm latest");
          const comparison = candidate[0] === latest[0]
            ? candidate[1] === latest[1]
              ? candidate[2] === latest[2] ? 0 : candidate[2] > latest[2] ? 1 : -1
              : candidate[1] > latest[1] ? 1 : -1
            : candidate[0] > latest[0] ? 1 : -1;
          if (comparison <= 0) throw new Error("Release candidate must be newer than current npm latest");
          NODE
          # Reauthorize current controls immediately before the npm mutation.
          current_main="$(gh api --method GET "/repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          [[ "$current_main" =~ ^[a-f0-9]{40}$ ]]
          for source in "$VERIFIED_SOURCE_SHA" "$WORKFLOW_SHA"; do
            status="$(gh api --method GET "/repos/$GITHUB_REPOSITORY/compare/$source...$current_main" --jq .status)"
            [[ "$status" == ahead || "$status" == identical ]]
          done
          for path in .github/workflows/release.yml; do
            tagged="$(gh api --method GET "/repos/$GITHUB_REPOSITORY/contents/$path?ref=$VERIFIED_SOURCE_SHA" --jq .sha)"
            current="$(gh api --method GET "/repos/$GITHUB_REPOSITORY/contents/$path?ref=$current_main" --jq .sha)"
            [[ "$tagged" =~ ^[a-f0-9]{40}$ && "$tagged" == "$current" ]]
          done
          for path in scripts/package-smoke.ts scripts/github-release.ts scripts/npm-provenance-identity.ts; do
            verified="$(gh api --method GET "/repos/$GITHUB_REPOSITORY/contents/$path?ref=$WORKFLOW_SHA" --jq .sha)"
            current="$(gh api --method GET "/repos/$GITHUB_REPOSITORY/contents/$path?ref=$current_main" --jq .sha)"
            [[ "$verified" =~ ^[a-f0-9]{40}$ && "$verified" == "$current" ]]
          done
          test "$(gh api --method GET "/repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" = "$current_main"
          publish_result="$(mktemp "$RUNNER_TEMP/soulscrape-publish-result.XXXXXX")"
          cd "$clean_npm_directory"
          npm publish "$TARBALL" \
            --access public \
            --globalconfig="$clean_global_config" \
            --ignore-scripts \
            --json \
            --provenance \
            --registry=https://registry.npmjs.org \
            --userconfig="$clean_user_config" \
            > "$publish_result"
          published_identity="$(PUBLISH_RESULT="$publish_result" EXPECTED_VERSION="$EXPECTED_VERSION" EXPECTED_ARCHIVE_INTEGRITY="$EXPECTED_ARCHIVE_INTEGRITY" node <<'NODE'
          const { readFileSync } = require("node:fs");
          // npm 11.19.0 `publish --json` prints one object keyed by package name.
          const result = JSON.parse(readFileSync(process.env.PUBLISH_RESULT, "utf8"));
          const expectedName = "@hraness/soulscrape";
          if (
            result === null
            || typeof result !== "object"
            || Array.isArray(result)
            || Object.keys(result).length !== 1
          ) throw new Error("npm did not return one published package record");
          const output = result[expectedName];
          if (
            output === null
            || typeof output !== "object"
            || Array.isArray(output)
            || output.name !== expectedName
            || output.version !== process.env.EXPECTED_VERSION
            || output.id !== `${expectedName}@${process.env.EXPECTED_VERSION}`
            || output.integrity !== process.env.EXPECTED_ARCHIVE_INTEGRITY
          ) throw new Error("npm did not return the exact published Soulscrape identity");
          process.stdout.write(`${output.id} ${output.integrity}`);
          NODE
          )"
          printf 'npm_state=published\npublished_identity=%s\n' "$published_identity" >> "$GITHUB_OUTPUT"

  admit_npm:
    name: Admit the public npm package
    needs: [verify, attest, publish_npm]
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      EXPECTED_ARCHIVE_SHA256: ${{ needs.verify.outputs.archive_sha256 }}
      NPM_STATE: ${{ needs.publish_npm.outputs.npm_state }}
      PUBLISHED_IDENTITY: ${{ needs.publish_npm.outputs.published_identity }}
      VERIFIED_SOURCE_SHA: ${{ needs.verify.outputs.source_sha }}
      VERIFIED_TAG: ${{ needs.verify.outputs.verified_tag }}
      WORKFLOW_SHA: ${{ needs.verify.outputs.workflow_sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false
          ref: ${{ needs.verify.outputs.source_sha }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: Pin npm
        run: npm install --global npm@11.19.0 --ignore-scripts --registry=https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          artifact-ids: ${{ needs.attest.outputs.artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/soulscrape-release
      - name: Import current npm admission verifier closure
        run: |
          set -euo pipefail
          current_main="$(gh api --method GET "/repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          [[ "$current_main" =~ ^[a-f0-9]{40}$ ]]
          for source in "$VERIFIED_SOURCE_SHA" "$WORKFLOW_SHA"; do
            status="$(gh api --method GET "/repos/$GITHUB_REPOSITORY/compare/$source...$current_main" --jq .status)"
            [[ "$status" == ahead || "$status" == identical ]]
          done
          for path in .github/workflows/release.yml; do
            tagged="$(gh api --method GET "/repos/$GITHUB_REPOSITORY/contents/$path?ref=$VERIFIED_SOURCE_SHA" --jq .sha)"
            current="$(gh api --method GET "/repos/$GITHUB_REPOSITORY/contents/$path?ref=$current_main" --jq .sha)"
            [[ "$tagged" =~ ^[a-f0-9]{40}$ && "$tagged" == "$current" ]]
          done
          for path in scripts/package-smoke.ts scripts/github-release.ts scripts/npm-provenance-identity.ts; do
            verified="$(gh api --method GET "/repos/$GITHUB_REPOSITORY/contents/$path?ref=$WORKFLOW_SHA" --jq .sha)"
            current="$(gh api --method GET "/repos/$GITHUB_REPOSITORY/contents/$path?ref=$current_main" --jq .sha)"
            [[ "$verified" =~ ^[a-f0-9]{40}$ && "$verified" == "$current" ]]
          done
          test "$(gh api --method GET "/repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" = "$current_main"
          for path in scripts/package-smoke.ts scripts/npm-provenance-identity.ts; do
            expected_blob="$(gh api --method GET "/repos/$GITHUB_REPOSITORY/contents/$path?ref=$WORKFLOW_SHA" --jq .sha)"
            [[ "$expected_blob" =~ ^[a-f0-9]{40}$ ]]
            gh api --method GET "/repos/$GITHUB_REPOSITORY/contents/$path?ref=$WORKFLOW_SHA" --jq .content | tr -d '\n' | base64 --decode > "$path"
            test "$(git hash-object "$path")" = "$expected_blob"
          done
      - name: Verify the public registry package, signatures, and provenance against the canonical asset
        run: |
          set -euo pipefail
          if [[ "$NPM_STATE" != published ]]; then
            echo "::error::npm publication did not record an exact registry state"
            exit 1
          fi
          if [[ "$GITHUB_REPOSITORY" != "hraness/soulscrape" || "$GITHUB_REF" != "refs/tags/$VERIFIED_TAG" || "$GITHUB_SHA" != "$VERIFIED_SOURCE_SHA" || "$(git rev-parse --verify HEAD^{commit})" != "$VERIFIED_SOURCE_SHA" ]]; then
            echo "::error::npm admission must verify the exact release tag source"
            exit 1
          fi
          version="${VERIFIED_TAG#v}"
          archive_name="hraness-soulscrape-$version.tgz"
          if [[ "$PUBLISHED_IDENTITY" != "@hraness/soulscrape@$version sha512-"* ]]; then
            echo "::error::npm publication identity is not the exact package coordinate"
            exit 1
          fi
          canonical_directory="$RUNNER_TEMP/soulscrape-release"
          if [[ "$(sha256sum "$canonical_directory/$archive_name" | cut -d ' ' -f 1)" != "$EXPECTED_ARCHIVE_SHA256" ]]; then
            echo "::error::Downloaded canonical archive does not match the verified build hash"
            exit 1
          fi
          registry_directory="$RUNNER_TEMP/soulscrape-registry"
          mkdir -m 700 "$registry_directory"
          (cd "$registry_directory" && npm pack "@hraness/soulscrape@$version" --ignore-scripts --json \
            --registry=https://registry.npmjs.org > npm-pack.json)
          registry_archive="$(node -e 'const r = require(process.argv[1]); if (!Array.isArray(r) || r.length !== 1 || typeof r[0].filename !== "string" || !/^hraness-soulscrape-[0-9.]+\.tgz$/u.test(r[0].filename)) process.exit(1); process.stdout.write(r[0].filename)' "$registry_directory/npm-pack.json")"
          if cmp --silent "$registry_directory/$registry_archive" "$canonical_directory/$archive_name"; then
            echo "Registry archive bytes are identical to the canonical GitHub asset"
          else
            echo "::error::Registry archive bytes differ from the canonical asset"
            exit 1
          fi
          bun --no-env-file --config=/dev/null run ./scripts/package-smoke.ts \
            --archive "$registry_directory/$registry_archive" \
            --pack-json "$registry_directory/npm-pack.json"
          consumer_directory="$RUNNER_TEMP/soulscrape-registry-consumer"
          mkdir -m 700 "$consumer_directory"
          (cd "$consumer_directory" \
            && printf '{ "name": "soulscrape-registry-consumer", "version": "0.0.0", "private": true }\n' > package.json \
            && npm install "@hraness/soulscrape@$version" --ignore-scripts --no-audit --no-fund \
              --registry=https://registry.npmjs.org \
            && npm audit signatures --json --include-attestations --omit=dev \
              --registry=https://registry.npmjs.org > npm-audit.json)
          bun run ./scripts/npm-provenance-identity.ts \
            --audit-json "$consumer_directory/npm-audit.json" \
            --expected-event push \
            --expected-name @hraness/soulscrape \
            --expected-owner-id 307125679 \
            --expected-ref "refs/tags/$VERIFIED_TAG" \
            --expected-repository hraness/soulscrape \
            --expected-repository-id 1350294135 \
            --expected-run-id "$GITHUB_RUN_ID" \
            --expected-max-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --expected-source-sha "$VERIFIED_SOURCE_SHA" \
            --expected-version "$version" \
            --expected-workflow-path .github/workflows/release.yml \
            --registry-archive "$registry_directory/$registry_archive"
