name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: stable-release
  cancel-in-progress: false

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      verified_tag: ${{ steps.identity.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: Pin npm
        run: npm install --global npm@11.19.0 --ignore-scripts --registry=https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - name: Verify release identity
        id: identity
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          package_version="$(bun -e 'console.log((await Bun.file("./package.json").json()).version)')"
          expected_tag="v$package_version"
          if [[ "$GITHUB_REF_NAME" != "$expected_tag" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package version $expected_tag"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/$DEFAULT_BRANCH"; then
            echo "::error::Tag $GITHUB_REF_NAME is not reachable from $DEFAULT_BRANCH"
            exit 1
          fi
          newest_stable_tag="$(git tag --list 'v*' | grep -E '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' | LC_ALL=C sort -V | tail -n 1)"
          if [[ "$newest_stable_tag" != "$GITHUB_REF_NAME" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME is not the newest stable version"
            exit 1
          fi
          printf 'tag=%s\n' "$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
      - run: bun run typecheck
      - run: bun run test
      - run: bun run check:runtime-policy
      - run: bun run check:schema
      - name: Verify exact public npm artifact
        run: |
          set -euo pipefail
          package_name="$(bun -e 'console.log((await Bun.file("./package.json").json()).name)')"
          package_version="$(bun -e 'console.log((await Bun.file("./package.json").json()).version)')"
          source_directory="$RUNNER_TEMP/ensoul-source-package"
          registry_directory="$RUNNER_TEMP/ensoul-registry-package"
          source_json="$RUNNER_TEMP/ensoul-source-pack.json"
          registry_json="$RUNNER_TEMP/ensoul-registry-pack.json"
          mkdir -p "$source_directory" "$registry_directory"
          npm pack \
            --ignore-scripts \
            --json \
            --pack-destination "$source_directory" \
            --registry=https://registry.npmjs.org > "$source_json"
          npm pack "$package_name@$package_version" \
            --ignore-scripts \
            --json \
            --pack-destination "$registry_directory" \
            --registry=https://registry.npmjs.org > "$registry_json"
          source_name="$(bun -e 'console.log((await Bun.file(process.argv.at(-1)).json())[0].filename)' "$source_json")"
          registry_name="$(bun -e 'console.log((await Bun.file(process.argv.at(-1)).json())[0].filename)' "$registry_json")"
          if [[ "$source_name" != "$registry_name" ]]; then
            echo "::error::Source and registry tarball names differ"
            exit 1
          fi
          source_archive="$source_directory/$source_name"
          registry_archive="$registry_directory/$registry_name"
          source_result="$(bun scripts/package-smoke.ts --archive "$source_archive" --pack-json "$source_json")"
          registry_result="$(bun scripts/package-smoke.ts --archive "$registry_archive" --pack-json "$registry_json")"
          printf '%s\n' "$source_result" "$registry_result"
          source_payload_sha256="$(bun -e 'console.log(JSON.parse(process.argv.at(-1)).payloadSha256)' "$source_result")"
          registry_payload_sha256="$(bun -e 'console.log(JSON.parse(process.argv.at(-1)).payloadSha256)' "$registry_result")"
          if [[ "$source_payload_sha256" != "$registry_payload_sha256" ]]; then
            echo "::error::Public npm payload differs from the tagged source artifact"
            exit 1
          fi

  publish:
    name: Publish
    needs: verify
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      VERIFIED_TAG: ${{ needs.verify.outputs.verified_tag }}
    steps:
      - name: Require immutable releases before publication
        run: |
          set -euo pipefail
          immutable_releases="$(gh api "/repos/$GITHUB_REPOSITORY/immutable-releases" --jq '.enabled')"
          if [[ "$immutable_releases" != "true" ]]; then
            echo "::error::Repository immutable releases must be enabled before creating $GITHUB_REF_NAME"
            exit 1
          fi
      - name: Publish verified GitHub release
        run: |
          set -euo pipefail
          if [[ -z "$VERIFIED_TAG" || "$VERIFIED_TAG" != "$GITHUB_REF_NAME" ]]; then
            echo "::error::Publish request does not match the verified tag"
            exit 1
          fi
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" \
              --verify-tag \
              --generate-notes \
              --latest \
              --title "Ensoul $GITHUB_REF_NAME"
          fi
          release_state="$(gh release view "$GITHUB_REF_NAME" \
            --json assets,isDraft,isImmutable,isPrerelease,tagName \
            --jq '[.tagName, .isDraft, .isPrerelease, .isImmutable, (.assets | length)] | @tsv')"
          expected_state="$GITHUB_REF_NAME"$'\tfalse\tfalse\ttrue\t0'
          if [[ "$release_state" != "$expected_state" ]]; then
            echo "::error::Release $GITHUB_REF_NAME is not published and immutable"
            exit 1
          fi
          latest_tag="$(gh api "/repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name')"
          if [[ "$latest_tag" != "$GITHUB_REF_NAME" ]]; then
            echo "::error::Latest release is $latest_tag, expected $GITHUB_REF_NAME"
            exit 1
          fi
