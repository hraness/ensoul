name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: stable-release
  cancel-in-progress: false

jobs:
  authorize:
    name: Authorize owner release tag
    permissions: {}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify immutable owner and public repository identity
        env:
          EXPECTED_ACTOR_ID: "894119"
          EXPECTED_REPOSITORY: "hraness/ensoul"
          EXPECTED_REPOSITORY_ID: "1350294135"
          REF_PROTECTED: ${{ github.ref_protected }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" != push || \
                "$GITHUB_ACTOR_ID" != "$EXPECTED_ACTOR_ID" || \
                "$GITHUB_REPOSITORY" != "$EXPECTED_REPOSITORY" || \
                "$GITHUB_REPOSITORY_ID" != "$EXPECTED_REPOSITORY_ID" || \
                "$REF_PROTECTED" != true ]]; then
            echo "::error::Release requires an owner-created protected tag in the exact public repository"
            exit 1
          fi
          EXPECTED_ACTOR_ID="$EXPECTED_ACTOR_ID" \
            EXPECTED_REPOSITORY="$EXPECTED_REPOSITORY" \
            EXPECTED_REPOSITORY_ID="$EXPECTED_REPOSITORY_ID" node <<'NODE'
          const { readFileSync } = require("node:fs");
          const event = JSON.parse(readFileSync(process.env.GITHUB_EVENT_PATH, "utf8"));
          if (
            event.sender?.id !== Number(process.env.EXPECTED_ACTOR_ID)
            || event.sender?.type !== "User"
            || event.repository?.id !== Number(process.env.EXPECTED_REPOSITORY_ID)
            || event.repository?.full_name !== process.env.EXPECTED_REPOSITORY
            || event.repository?.visibility !== "public"
            || event.repository?.private !== false
            || event.repository?.default_branch !== "main"
          ) throw new Error("Tag-push sender or public repository identity is not the immutable release authority");
          NODE

  verify:
    name: Verify
    needs: authorize
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      default_branch: ${{ steps.identity.outputs.default_branch }}
      source_sha: ${{ steps.identity.outputs.source_sha }}
      verified_tag: ${{ steps.identity.outputs.tag }}
      workflow_sha: ${{ steps.identity.outputs.workflow_sha }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: Pin npm
        run: npm install --global npm@11.19.0 --ignore-scripts --registry=https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - name: Verify release identity
        id: identity
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REF_PROTECTED: ${{ github.ref_protected }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" != push || "$REF_PROTECTED" != true ]]; then
            echo "::error::Release requires a protected owner-created stable tag"
            exit 1
          fi
          git check-ref-format "refs/heads/$DEFAULT_BRANCH"
          git fetch --no-tags origin \
            "refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"
          default_head="$(git rev-parse "origin/$DEFAULT_BRANCH")"
          checked_out_head="$(git rev-parse HEAD)"
          package_version="$(bun -e 'console.log((await Bun.file("./package.json").json()).version)')"
          if [[ ! "$package_version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Package version $package_version is not stable semantic version"
            exit 1
          fi
          expected_tag="v$package_version"
          if [[ "$GITHUB_REF" != "refs/tags/$expected_tag" || \
                "$GITHUB_REF_NAME" != "$expected_tag" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package version $expected_tag"
            exit 1
          fi
          git check-ref-format "refs/tags/$expected_tag"
          release_ref="refs/ensoul-release-tags/$expected_tag"
          git fetch --no-tags origin "refs/tags/$expected_tag:$release_ref"
          if [[ "$(git cat-file -t "$release_ref")" != tag ]]; then
            echo "::error::Release tag must be annotated"
            exit 1
          fi
          tag_commit="$(git rev-parse "$release_ref^{commit}")"
          if [[ "$GITHUB_SHA" != "$tag_commit" || \
                "$checked_out_head" != "$tag_commit" ]]; then
            echo "::error::Tag does not match the checked release commit"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$tag_commit" "$default_head"; then
            echo "::error::Tag $GITHUB_REF_NAME is not reachable from $DEFAULT_BRANCH"
            exit 1
          fi
          if ! git diff --quiet --no-ext-diff --no-textconv \
            "$tag_commit" "$default_head" -- \
            .github/workflows/release.yml \
            .github/workflows/npm-stage.yml; then
            echo "::error::Tagged and current release workflow controls differ"
            exit 1
          fi
          git fetch --force --tags origin
          if [[ "$(git rev-parse "refs/tags/$expected_tag^{commit}")" != "$tag_commit" ]]; then
            echo "::error::Tag $expected_tag changed during verification"
            exit 1
          fi
          newest_stable_tag="$(git tag --list 'v*' | grep -E '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' | LC_ALL=C sort -V | tail -n 1)"
          if [[ "$newest_stable_tag" != "$GITHUB_REF_NAME" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME is not the newest stable version"
            exit 1
          fi
          printf 'default_branch=%s\nsource_sha=%s\ntag=%s\nworkflow_sha=%s\n' \
            "$DEFAULT_BRANCH" "$tag_commit" "$GITHUB_REF_NAME" "$default_head" \
            >> "$GITHUB_OUTPUT"
      - run: bun run typecheck
      - run: bun run test
      - run: bun run check:runtime-policy
      - run: bun run check:schema
      - name: Verify exact public npm artifact
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_SHA: ${{ steps.identity.outputs.workflow_sha }}
        run: |
          set -euo pipefail
          package_name="$(bun -e 'console.log((await Bun.file("./package.json").json()).name)')"
          package_version="$(bun -e 'console.log((await Bun.file("./package.json").json()).version)')"
          source_directory="$RUNNER_TEMP/ensoul-source-package"
          registry_directory="$RUNNER_TEMP/ensoul-registry-package"
          source_json="$RUNNER_TEMP/ensoul-source-pack.json"
          registry_json="$RUNNER_TEMP/ensoul-registry-pack.json"
          registry_view_json="$RUNNER_TEMP/ensoul-registry-view.json"
          mkdir -p "$source_directory" "$registry_directory"
          npm pack \
            --ignore-scripts \
            --json \
            --pack-destination "$source_directory" \
            --registry=https://registry.npmjs.org > "$source_json"
          npm pack "$package_name@$package_version" \
            --ignore-scripts \
            --json \
            --pack-destination "$registry_directory" \
            --registry=https://registry.npmjs.org > "$registry_json"
          npm view "$package_name@$package_version" name version dist \
            --json \
            --registry=https://registry.npmjs.org > "$registry_view_json"
          latest_version="$(npm view "$package_name" dist-tags.latest \
            --json \
            --registry=https://registry.npmjs.org)"
          if [[ "$latest_version" != "\"$package_version\"" ]]; then
            echo "::error::npm latest is $latest_version, expected $package_version"
            exit 1
          fi
          source_name="$(bun -e 'console.log((await Bun.file(process.argv.at(-1)).json())[0].filename)' "$source_json")"
          registry_name="$(bun -e 'console.log((await Bun.file(process.argv.at(-1)).json())[0].filename)' "$registry_json")"
          if [[ "$source_name" != "$registry_name" ]]; then
            echo "::error::Source and registry tarball names differ"
            exit 1
          fi
          source_archive="$source_directory/$source_name"
          registry_archive="$registry_directory/$registry_name"
          if [[ ! "$WORKFLOW_SHA" =~ ^[a-f0-9]{40}$ ]]; then
            echo "::error::Current release verifier identity is invalid"
            exit 1
          fi
          current_package_smoke="$GITHUB_WORKSPACE/scripts/.ensoul-current-package-smoke.ts"
          current_provenance_identity="$GITHUB_WORKSPACE/scripts/.ensoul-current-npm-provenance-identity.ts"
          if [[ -e "$current_package_smoke" || -L "$current_package_smoke" || \
                -e "$current_provenance_identity" || -L "$current_provenance_identity" ]]; then
            echo "::error::Current release verifier materialization path already exists"
            exit 1
          fi
          git show "$WORKFLOW_SHA:scripts/package-smoke.ts" > "$current_package_smoke"
          git show "$WORKFLOW_SHA:scripts/npm-provenance-identity.ts" > "$current_provenance_identity"
          current_tools=(
            "scripts/package-smoke.ts:$current_package_smoke"
            "scripts/npm-provenance-identity.ts:$current_provenance_identity"
          )
          for current_tool_binding in "${current_tools[@]}"; do
            relative_tool="${current_tool_binding%%:*}"
            current_tool="${current_tool_binding#*:}"
            if [[ ! -f "$current_tool" || -L "$current_tool" ]]; then
              echo "::error::Current release verifier is missing or linked: $relative_tool"
              exit 1
            fi
            expected_blob="$(git rev-parse "$WORKFLOW_SHA:$relative_tool")"
            actual_blob="$(git hash-object "$current_tool")"
            if [[ "$actual_blob" != "$expected_blob" ]]; then
              echo "::error::Current release verifier materialization changed: $relative_tool"
              exit 1
            fi
          done
          source_result="$(bun --no-env-file --config=/dev/null run "$current_package_smoke" \
            --archive "$source_archive" --pack-json "$source_json")"
          registry_result="$(bun --no-env-file --config=/dev/null run "$current_package_smoke" \
            --archive "$registry_archive" --pack-json "$registry_json")"
          printf '%s\n' "$source_result" "$registry_result"
          source_payload_sha256="$(bun -e 'console.log(JSON.parse(process.argv.at(-1)).payloadSha256)' "$source_result")"
          registry_payload_sha256="$(bun -e 'console.log(JSON.parse(process.argv.at(-1)).payloadSha256)' "$registry_result")"
          if [[ "$source_payload_sha256" != "$registry_payload_sha256" ]]; then
            echo "::error::Public npm payload differs from the tagged source artifact"
            exit 1
          fi
          audit_directory="$RUNNER_TEMP/ensoul-release-signature-audit"
          audit_json="$RUNNER_TEMP/ensoul-release-signature-audit.json"
          mkdir -p "$audit_directory"
          AUDIT_DIRECTORY="$audit_directory" \
            PACKAGE_NAME="$package_name" \
            PACKAGE_VERSION="$package_version" node <<'NODE'
          const { writeFileSync } = require("node:fs");
          const { join } = require("node:path");
          writeFileSync(join(process.env.AUDIT_DIRECTORY, "package.json"), `${JSON.stringify({
            name: "ensoul-release-signature-audit",
            private: true,
            version: "0.0.0",
            dependencies: { [process.env.PACKAGE_NAME]: process.env.PACKAGE_VERSION },
          })}\n`, { encoding: "utf8", mode: 0o600 });
          NODE
          npm install \
            --prefix "$audit_directory" \
            --ignore-scripts \
            --omit=dev \
            --omit=optional \
            --no-audit \
            --no-fund \
            --registry=https://registry.npmjs.org
          npm audit signatures \
            --prefix "$audit_directory" \
            --json \
            --include-attestations \
            --omit=dev \
            --omit=optional \
            --registry=https://registry.npmjs.org \
            > "$audit_json"
          provenance_identity="$(bun --no-env-file --config=/dev/null run "$current_provenance_identity" \
            --audit-json "$audit_json" \
            --expected-source-sha "$GITHUB_SHA" \
            --expected-version "$package_version" \
            --registry-archive "$registry_archive" \
            --registry-view-json "$registry_view_json")"
          read -r stage_run_id stage_run_attempt < <(PROVENANCE_IDENTITY="$provenance_identity" node <<'NODE'
          const identity = JSON.parse(process.env.PROVENANCE_IDENTITY ?? "null");
          if (
            !Number.isSafeInteger(identity?.runId)
            || identity.runId < 1
            || !Number.isSafeInteger(identity?.runAttempt)
            || identity.runAttempt < 1
            || Object.keys(identity).sort().join(",") !== "runAttempt,runId"
          ) throw new Error("Verified npm provenance returned an invalid run identity");
          process.stdout.write(`${identity.runId} ${identity.runAttempt}\n`);
          NODE
          )
          stage_attempt_json="$(mktemp "$RUNNER_TEMP/ensoul-published-stage-attempt.XXXXXX")"
          stage_workflow_json="$(mktemp "$RUNNER_TEMP/ensoul-published-stage-workflow.XXXXXX")"
          repository_json="$(mktemp "$RUNNER_TEMP/ensoul-published-stage-repository.XXXXXX")"
          trap 'rm -f "$stage_attempt_json" "$stage_workflow_json" "$repository_json"' EXIT
          gh api --method GET \
            "/repos/$GITHUB_REPOSITORY/actions/runs/$stage_run_id/attempts/$stage_run_attempt" \
            > "$stage_attempt_json"
          gh api --method GET \
            "/repos/$GITHUB_REPOSITORY/actions/workflows/345387949" \
            > "$stage_workflow_json"
          gh api --method GET "/repos/$GITHUB_REPOSITORY" > "$repository_json"
          ATTEMPT_JSON="$stage_attempt_json" \
            EXPECTED_RUN_ATTEMPT="$stage_run_attempt" \
            EXPECTED_RUN_ID="$stage_run_id" \
            EXPECTED_SHA="$GITHUB_SHA" \
            REPOSITORY_JSON="$repository_json" \
            WORKFLOW_JSON="$stage_workflow_json" node <<'NODE'
          const { readFileSync } = require("node:fs");
          const attempt = JSON.parse(readFileSync(process.env.ATTEMPT_JSON, "utf8"));
          const workflow = JSON.parse(readFileSync(process.env.WORKFLOW_JSON, "utf8"));
          const repository = JSON.parse(readFileSync(process.env.REPOSITORY_JSON, "utf8"));
          const runId = Number(process.env.EXPECTED_RUN_ID);
          const runAttempt = Number(process.env.EXPECTED_RUN_ATTEMPT);
          if (
            !Number.isSafeInteger(runId)
            || !Number.isSafeInteger(runAttempt)
            || attempt.id !== runId
            || attempt.run_attempt !== runAttempt
            || attempt.workflow_id !== 345387949
            || attempt.name !== "Build or stage npm package"
            || attempt.path !== ".github/workflows/npm-stage.yml"
            || attempt.event !== "workflow_dispatch"
            || attempt.head_branch !== "main"
            || attempt.head_sha !== process.env.EXPECTED_SHA
            || attempt.status !== "completed"
            || attempt.conclusion !== "success"
            || attempt.actor?.id !== 894119
            || attempt.actor?.type !== "User"
            || attempt.triggering_actor?.id !== 894119
            || attempt.triggering_actor?.type !== "User"
            || attempt.repository?.id !== 1350294135
            || attempt.repository?.full_name !== "hraness/ensoul"
            || attempt.repository?.private !== false
            || workflow.id !== 345387949
            || workflow.name !== "Build or stage npm package"
            || workflow.path !== ".github/workflows/npm-stage.yml"
            || workflow.state !== "active"
            || repository.id !== 1350294135
            || repository.full_name !== "hraness/ensoul"
            || repository.visibility !== "public"
            || repository.private !== false
            || repository.default_branch !== "main"
          ) throw new Error("Published npm provenance is not bound to the completed owner-authorized stage attempt");
          NODE

  publish:
    name: Publish
    needs: verify
    permissions:
      actions: read
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      DEFAULT_BRANCH: ${{ needs.verify.outputs.default_branch }}
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      IMMUTABLE_RELEASES_ENABLED: ${{ vars.IMMUTABLE_RELEASES_ENABLED }}
      VERIFIED_SOURCE_SHA: ${{ needs.verify.outputs.source_sha }}
      VERIFIED_TAG: ${{ needs.verify.outputs.verified_tag }}
      WORKFLOW_SHA: ${{ needs.verify.outputs.workflow_sha }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: main
      - name: Reauthorize current release attempt
        env:
          EXPECTED_ACTOR_ID: "894119"
          EXPECTED_REPOSITORY: "hraness/ensoul"
          EXPECTED_REPOSITORY_ID: "1350294135"
          EXPECTED_WORKFLOW_ID: "345387950"
          EXPECTED_WORKFLOW_NAME: "release"
          EXPECTED_WORKFLOW_PATH: ".github/workflows/release.yml"
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_RUN_ID" =~ ^[1-9][0-9]*$ || \
                ! "$GITHUB_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ || \
                ! "$VERIFIED_SOURCE_SHA" =~ ^[a-f0-9]{40}$ || \
                ! "$WORKFLOW_SHA" =~ ^[a-f0-9]{40}$ || \
                ! "$VERIFIED_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ || \
                "$DEFAULT_BRANCH" != main || \
                "$GITHUB_EVENT_NAME" != push || \
                "$GITHUB_REPOSITORY" != "$EXPECTED_REPOSITORY" || \
                "$GITHUB_REPOSITORY_ID" != "$EXPECTED_REPOSITORY_ID" || \
                "$GITHUB_REF" != "refs/tags/$VERIFIED_TAG" || \
                "$GITHUB_SHA" != "$VERIFIED_SOURCE_SHA" ]]; then
            echo "::error::Current release attempt is not the exact protected tag run"
            exit 1
          fi
          attempt_json="$(mktemp "$RUNNER_TEMP/ensoul-release-attempt.XXXXXX")"
          workflow_json="$(mktemp "$RUNNER_TEMP/ensoul-release-workflow.XXXXXX")"
          repository_json="$(mktemp "$RUNNER_TEMP/ensoul-release-repository.XXXXXX")"
          gh api --method GET \
            "/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT" \
            > "$attempt_json"
          gh api --method GET \
            "/repos/$GITHUB_REPOSITORY/actions/workflows/$EXPECTED_WORKFLOW_ID" \
            > "$workflow_json"
          gh api --method GET "/repos/$GITHUB_REPOSITORY" > "$repository_json"
          ATTEMPT_JSON="$attempt_json" \
            WORKFLOW_JSON="$workflow_json" \
            REPOSITORY_JSON="$repository_json" \
            EXPECTED_ACTOR_ID="$EXPECTED_ACTOR_ID" \
            EXPECTED_REPOSITORY="$EXPECTED_REPOSITORY" \
            EXPECTED_REPOSITORY_ID="$EXPECTED_REPOSITORY_ID" \
            EXPECTED_RUN_ID="$GITHUB_RUN_ID" \
            EXPECTED_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
            EXPECTED_SHA="$VERIFIED_SOURCE_SHA" \
            EXPECTED_TAG="$VERIFIED_TAG" \
            EXPECTED_WORKFLOW_ID="$EXPECTED_WORKFLOW_ID" \
            EXPECTED_WORKFLOW_NAME="$EXPECTED_WORKFLOW_NAME" \
            EXPECTED_WORKFLOW_PATH="$EXPECTED_WORKFLOW_PATH" node <<'NODE'
          const { readFileSync } = require("node:fs");
          const positiveInteger = (name) => {
            const value = process.env[name] ?? "";
            if (!/^[1-9][0-9]*$/u.test(value)) throw new Error(`Invalid ${name}`);
            const number = Number(value);
            if (!Number.isSafeInteger(number)) throw new Error(`Unsafe ${name}`);
            return number;
          };
          const attempt = JSON.parse(readFileSync(process.env.ATTEMPT_JSON, "utf8"));
          const workflow = JSON.parse(readFileSync(process.env.WORKFLOW_JSON, "utf8"));
          const repository = JSON.parse(readFileSync(process.env.REPOSITORY_JSON, "utf8"));
          const actorId = positiveInteger("EXPECTED_ACTOR_ID");
          const repositoryId = positiveInteger("EXPECTED_REPOSITORY_ID");
          const runId = positiveInteger("EXPECTED_RUN_ID");
          const runAttempt = positiveInteger("EXPECTED_RUN_ATTEMPT");
          const workflowId = positiveInteger("EXPECTED_WORKFLOW_ID");
          if (
            attempt.id !== runId
            || attempt.run_attempt !== runAttempt
            || attempt.workflow_id !== workflowId
            || attempt.name !== process.env.EXPECTED_WORKFLOW_NAME
            || attempt.path !== process.env.EXPECTED_WORKFLOW_PATH
            || attempt.event !== "push"
            || attempt.head_branch !== process.env.EXPECTED_TAG
            || attempt.head_sha !== process.env.EXPECTED_SHA
            || attempt.status !== "in_progress"
            || attempt.conclusion !== null
            || attempt.actor?.id !== actorId
            || attempt.actor?.type !== "User"
            || attempt.triggering_actor?.id !== actorId
            || attempt.triggering_actor?.type !== "User"
            || attempt.repository?.id !== repositoryId
            || attempt.repository?.full_name !== process.env.EXPECTED_REPOSITORY
            || attempt.repository?.private !== false
            || workflow.id !== workflowId
            || workflow.name !== process.env.EXPECTED_WORKFLOW_NAME
            || workflow.path !== process.env.EXPECTED_WORKFLOW_PATH
            || workflow.state !== "active"
            || repository.id !== repositoryId
            || repository.full_name !== process.env.EXPECTED_REPOSITORY
            || repository.visibility !== "public"
            || repository.private !== false
            || repository.default_branch !== "main"
          ) throw new Error("Current release attempt is not owner-authorized for this exact public workflow");
          NODE
          tag_ref_json="$(mktemp "$RUNNER_TEMP/ensoul-release-tag-ref.XXXXXX")"
          tag_object_json="$(mktemp "$RUNNER_TEMP/ensoul-release-tag-object.XXXXXX")"
          gh api --method GET "/repos/$GITHUB_REPOSITORY/git/ref/tags/$VERIFIED_TAG" > "$tag_ref_json"
          tag_object_sha="$(TAG_REF_JSON="$tag_ref_json" node -e '
            const value = JSON.parse(require("node:fs").readFileSync(process.env.TAG_REF_JSON, "utf8"));
            if (value?.object?.type !== "tag" || !/^[a-f0-9]{40}$/u.test(value.object.sha ?? "")) process.exit(1);
            process.stdout.write(value.object.sha);
          ')"
          gh api --method GET "/repos/$GITHUB_REPOSITORY/git/tags/$tag_object_sha" > "$tag_object_json"
          TAG_OBJECT_JSON="$tag_object_json" EXPECTED_SHA="$VERIFIED_SOURCE_SHA" node -e '
            const value = JSON.parse(require("node:fs").readFileSync(process.env.TAG_OBJECT_JSON, "utf8"));
            if (value?.object?.type !== "commit" || value.object.sha !== process.env.EXPECTED_SHA) process.exit(1);
          '
          current_default_sha="$(gh api --method GET --jq '.sha' \
            "/repos/$GITHUB_REPOSITORY/commits/$DEFAULT_BRANCH")"
          comparison_status="$(gh api --method GET --jq '.status' \
            "/repos/$GITHUB_REPOSITORY/compare/$VERIFIED_SOURCE_SHA...$current_default_sha")"
          if [[ "$comparison_status" != ahead && "$comparison_status" != identical ]]; then
            echo "::error::Tag $VERIFIED_TAG is no longer reachable from $DEFAULT_BRANCH"
            exit 1
          fi
      - name: Require immutable releases before publication
        run: |
          set -euo pipefail
          if [[ "$IMMUTABLE_RELEASES_ENABLED" != "true" ]]; then
            echo "::error::An administrator must enable immutable releases and set the IMMUTABLE_RELEASES_ENABLED repository variable to true before creating $GITHUB_REF_NAME"
            exit 1
          fi
      - name: Publish verified GitHub release
        run: |
          set -euo pipefail
          if [[ ! "$VERIFIED_SOURCE_SHA" =~ ^[a-f0-9]{40}$ || \
                ! "$WORKFLOW_SHA" =~ ^[a-f0-9]{40}$ || \
                ! "$VERIFIED_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ || \
                "$DEFAULT_BRANCH" != main || \
                "$GITHUB_EVENT_NAME" != push || \
                "$GITHUB_REF" != "refs/tags/$VERIFIED_TAG" || \
                "$GITHUB_REF_NAME" != "$VERIFIED_TAG" || \
                "$GITHUB_SHA" != "$VERIFIED_SOURCE_SHA" ]]; then
            echo "::error::Publish request does not match the verified tag event and source"
            exit 1
          fi
          verify_current_release_controls() {
            local advertised_main imported_main
            advertised_main="$(gh api --method GET --jq '.sha' \
              "/repos/$GITHUB_REPOSITORY/commits/$DEFAULT_BRANCH")"
            git fetch --no-tags --force origin \
              "refs/heads/$DEFAULT_BRANCH:refs/remotes/ensoul-release-current/$DEFAULT_BRANCH"
            imported_main="$(git rev-parse "refs/remotes/ensoul-release-current/$DEFAULT_BRANCH")"
            if [[ ! "$advertised_main" =~ ^[a-f0-9]{40}$ || \
                  "$imported_main" != "$advertised_main" ]]; then
              echo "::error::Could not import one exact current $DEFAULT_BRANCH authority" >&2
              return 1
            fi
            if ! git merge-base --is-ancestor "$VERIFIED_SOURCE_SHA" "$imported_main" || \
               ! git merge-base --is-ancestor "$WORKFLOW_SHA" "$imported_main"; then
              echo "::error::Release source or reviewed verifier is no longer on current $DEFAULT_BRANCH" >&2
              return 1
            fi
            if ! git diff --quiet --no-ext-diff --no-textconv \
              "$VERIFIED_SOURCE_SHA" "$imported_main" -- \
              .github/workflows/release.yml \
              .github/workflows/npm-stage.yml; then
              echo "::error::Tagged and current release workflow controls differ" >&2
              return 1
            fi
            if ! git diff --quiet --no-ext-diff --no-textconv \
              "$WORKFLOW_SHA" "$imported_main" -- \
              scripts/package-smoke.ts \
              scripts/npm-provenance-identity.ts; then
              echo "::error::Current release verifier controls changed after verification" >&2
              return 1
            fi
            printf '%s\n' "$imported_main"
          }

          current_tag_sha="$(gh api --method GET --jq '.sha' \
            "/repos/$GITHUB_REPOSITORY/commits/$VERIFIED_TAG")"
          current_default_sha="$(verify_current_release_controls)"
          if [[ "$current_tag_sha" != "$VERIFIED_SOURCE_SHA" ]]; then
            echo "::error::Tag $VERIFIED_TAG moved to $current_tag_sha after verification"
            exit 1
          fi
          comparison_status="$(gh api --method GET --jq '.status' \
            "/repos/$GITHUB_REPOSITORY/compare/$VERIFIED_SOURCE_SHA...$current_default_sha")"
          if [[ "$comparison_status" != ahead && "$comparison_status" != identical ]]; then
            echo "::error::Tag $VERIFIED_TAG is no longer reachable from $DEFAULT_BRANCH"
            exit 1
          fi
          release_title="Ensoul $VERIFIED_TAG"
          release_body="$(printf '%s\n\n%s\n%s\n%s\n' \
            'Automated immutable Ensoul release.' \
            "Source: $VERIFIED_SOURCE_SHA" \
            "Workflow: .github/workflows/release.yml" \
            "Run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID")"
          verify_exact_release() {
            RELEASE_JSON="$1" \
              EXPECTED_BODY="$release_body" \
              EXPECTED_SOURCE_SHA="$VERIFIED_SOURCE_SHA" \
              EXPECTED_TAG="$VERIFIED_TAG" \
              EXPECTED_TITLE="$release_title" node <<'NODE'
          const { readFileSync } = require("node:fs");
          const release = JSON.parse(readFileSync(process.env.RELEASE_JSON, "utf8"));
          if (
            !Number.isSafeInteger(release?.id)
            || release.id < 1
            || release.tag_name !== process.env.EXPECTED_TAG
            || release.name !== process.env.EXPECTED_TITLE
            || release.body !== process.env.EXPECTED_BODY
            || release.draft !== false
            || release.prerelease !== false
            || release.immutable !== true
            || !Array.isArray(release.assets)
            || release.assets.length !== 0
            || release.author?.id !== 41898282
            || release.author?.login !== "github-actions[bot]"
            || release.author?.type !== "Bot"
            || !process.env.EXPECTED_BODY?.includes(`Source: ${process.env.EXPECTED_SOURCE_SHA}`)
          ) throw new Error("Existing GitHub Release is not the exact immutable Actions-authored release for this run and source");
          NODE
          }
          release_json="$(mktemp "$RUNNER_TEMP/ensoul-release-record.XXXXXX")"
          release_error="$(mktemp "$RUNNER_TEMP/ensoul-release-lookup-error.XXXXXX")"
          trap 'rm -f "$release_json" "$release_error"' EXIT
          set +e
          gh api --method GET \
            "/repos/$GITHUB_REPOSITORY/releases/tags/$VERIFIED_TAG" \
            > "$release_json" 2> "$release_error"
          release_lookup_status=$?
          set -e
          if [[ $release_lookup_status -eq 0 ]]; then
            verify_exact_release "$release_json"
          elif grep -Eq '\(HTTP 404\)$' "$release_error"; then
            latest_before_release="$(npm view "@hraness/ensoul" dist-tags.latest \
              --json --registry=https://registry.npmjs.org)"
            if [[ "$latest_before_release" != "\"${VERIFIED_TAG#v}\"" ]]; then
              echo "::error::npm latest advanced before release mutation: $latest_before_release"
              exit 1
            fi
            final_tag_sha="$(gh api --method GET --jq '.sha' \
              "/repos/$GITHUB_REPOSITORY/commits/$VERIFIED_TAG")"
            final_default_sha="$(verify_current_release_controls)"
            if [[ "$final_tag_sha" != "$VERIFIED_SOURCE_SHA" || \
                  "$final_default_sha" != "$current_default_sha" ]]; then
              echo "::error::Release tag or current $DEFAULT_BRANCH moved during final release authorization"
              exit 1
            fi
            gh release create "$GITHUB_REF_NAME" \
              --verify-tag \
              --latest \
              --title "$release_title" \
              --notes "$release_body"
          else
            cat "$release_error"
            echo "::error::Could not prove whether $VERIFIED_TAG already has a GitHub Release"
            exit 1
          fi
          gh api --method GET \
            "/repos/$GITHUB_REPOSITORY/releases/tags/$VERIFIED_TAG" \
            > "$release_json"
          verify_exact_release "$release_json"
          latest_tag="$(gh api "/repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name')"
          if [[ "$latest_tag" != "$GITHUB_REF_NAME" ]]; then
            echo "::error::Latest release is $latest_tag, expected $GITHUB_REF_NAME"
            exit 1
          fi
